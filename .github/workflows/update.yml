name: auto-update
# Fetches fresh news, matches it to the network, and commits the result.
# The Alicloud server (and Vercel, if connected) pull from this repo, so a
# commit here goes live automatically.

on:
  schedule:
    - cron: "0 */6 * * *"       # every 6 hours
  workflow_dispatch:            # manual "Run workflow" button
  push:
    paths:                      # re-validate when the pipeline itself changes
      - ".github/workflows/**"
      - "tools/**"

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: fetch news (Google News, Abu Dhabi entities)
        run: python tools/fetch_news.py
      - name: scrape tier-1 GCC media (headlines + summaries)
        run: python tools/scrape_news.py
      - name: match news to all region networks
        run: python tools/match_news.py
      - name: update report
        run: python tools/report.py
      - name: commit & push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_inbox scraped_news news_data.js data/suggested_edges.csv reports
          git add dubai/news_data.js northern/news_data.js saudi/news_data.js qatar/news_data.js bahrain/news_data.js oman/news_data.js kuwait/news_data.js
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto: news refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
      - name: deploy directly to the Alicloud server
        # GitHub->server, bypassing the unreliable server->GitHub path from
        # mainland China. Needs the DEPLOY_KEY repo secret (private half of
        # deploy_key_github); skips gracefully when absent.
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          SERVER: 47.121.211.166
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "no DEPLOY_KEY secret - skipping direct deploy (server cron will pull when it can)"; exit 0; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$SERVER" >> ~/.ssh/known_hosts 2>/dev/null
          git bundle create /tmp/pn.bundle main
          scp -i ~/.ssh/deploy /tmp/pn.bundle root@"$SERVER":/tmp/pn.bundle
          ssh -i ~/.ssh/deploy root@"$SERVER" "cd /var/www/power_network && git pull --ff-only /tmp/pn.bundle main && rm -f /tmp/pn.bundle && git log --oneline -1"
