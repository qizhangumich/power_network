/* ================================================================
   SHEETS — desktop: floating panels · phone: draggable bottom sheets
   with peek / half / full states (swipe down past peek to dismiss)
   ================================================================ */
const Sheets = (() => {
  const st = new Map();
  const RIGHT = ["detail", "mypanel", "filters"];
  const all = () => [...document.querySelectorAll(".sheet")];
  function avail(){
    const tb = document.getElementById("topbar").getBoundingClientRect();
    return Math.max(200, H - Math.max(56, tb.bottom + 6));
  }
  function hFor(el, state){
    const A = avail();
    if(state === "peek") return Math.min(A, Math.max(120, el._peek || 210));
    if(state === "half") return Math.round(A * 0.58);
    return A;
  }
  function apply(el){
    if(!isMob()){ el.style.removeProperty("--sh"); return; }
    el.style.setProperty("--sh", hFor(el, st.get(el) || "half") + "px");
    el.dataset.state = st.get(el) || "half";
  }
  function sync(){
    const mob = isMob();
    document.body.classList.toggle("rp-open", !mob && RIGHT.some(id => document.getElementById(id).classList.contains("open")));
    const ctl = document.getElementById("mapctl");
    const vh = visibleHeight();
    ctl.style.bottom = mob ? `calc(${vh + 14}px + var(--sab))` : "";
    ctl.style.opacity = mob && vh > H * 0.62 ? "0" : "";
    ctl.style.pointerEvents = mob && vh > H * 0.62 ? "none" : "";
    document.documentElement.style.setProperty("--toast-b", (vh + 16) + "px");
  }
  function open(el, state){
    if(isMob()) all().forEach(o => { if(o !== el && o.classList.contains("open")) close(o); });
    else if(RIGHT.includes(el.id)) RIGHT.forEach(id => { const o = document.getElementById(id); if(o !== el && o.classList.contains("open")) close(o, true); });
    st.set(el, state || st.get(el) || "half");
    el.classList.add("open");
    apply(el);
    sync();
  }
  function close(el, silent){
    if(!el.classList.contains("open")) return;
    el.classList.remove("open");
    if(el.id === "legend" && !isMob()) el.classList.add("open");      // desktop legend is always on screen
    st.delete(el);
    sync();
    if(!silent && el._onclose) el._onclose();
  }
  function setState(el, s){ st.set(el, s); apply(el); sync(); }
  function state(el){ return st.get(el); }
  function setPeek(el, anchor){
    el._peek = anchor ? Math.min(H * 0.6, 30 + anchor.offsetTop + anchor.offsetHeight + 14 + (el._peekExtra || 0)) : 210;
    if(el.classList.contains("open")) apply(el);
  }
  function visibleHeight(){
    if(!isMob()) return 0;
    let m = 0;
    all().forEach(el => { if(el.classList.contains("open")) m = Math.max(m, hFor(el, st.get(el) || "half")); });
    return m;
  }
  function relayout(){ all().forEach(el => { if(el.classList.contains("open")) apply(el); }); sync(); }
  function wire(el){
    const grab = el.querySelector(".grab");
    if(!grab) return;
    let drag = null;
    grab.addEventListener("pointerdown", ev => {
      if(!isMob()) return;
      drag = {y0:ev.clientY, h0:hFor(el, st.get(el) || "half"), lastY:ev.clientY, lastT:performance.now(), v:0, moved:false, h:0};
      drag.h = drag.h0;
      el.classList.add("dragging");
      try { grab.setPointerCapture(ev.pointerId); } catch(e){}
    });
    grab.addEventListener("pointermove", ev => {
      if(!drag) return;
      const dy = ev.clientY - drag.y0;
      if(Math.abs(dy) > 5) drag.moved = true;
      drag.h = Math.max(60, Math.min(avail(), drag.h0 - dy));
      el.style.setProperty("--sh", drag.h + "px");
      const now = performance.now();
      drag.v = (ev.clientY - drag.lastY) / Math.max(1, now - drag.lastT);
      drag.lastY = ev.clientY; drag.lastT = now;
    });
    const end = () => {
      if(!drag) return;
      const d = drag; drag = null;
      el.classList.remove("dragging");
      if(!d.moved){                                  // a tap on the handle cycles the height
        const s = st.get(el) || "half";
        setState(el, s === "peek" ? "half" : s === "half" ? "full" : "peek");
        return;
      }
      const proj = d.h - d.v * 220;                  // flick-aware
      if(proj < hFor(el, "peek") - 70){ close(el); return; }
      const best = ["full", "half", "peek"].map(s => [s, hFor(el, s)])
        .reduce((b, s) => Math.abs(s[1] - proj) < Math.abs(b[1] - proj) ? s : b);
      setState(el, best[0]);
    };
    grab.addEventListener("pointerup", end);
    grab.addEventListener("pointercancel", end);
  }
  return {open, close, setState, state, setPeek, visibleHeight, relayout, wire, sync};
})();

function viaName(r){ const v = r.nodes[1]; return v ? (v.kind === "me" ? t().you : nm(v)) : ""; }
function renderPath(){

  if(PV.intro) return renderIntroPath();
  const T = t(), r = PV.routes[PV.idx], tg = PV.target;
  PANEL_MODE = "path";
  let h = `<div class="eyebrow">${svgI("route")} ${PV.from ? T.pathBetween : T.pathTo}</div>`
        + `<div class="pf-head">${avatarHtml(tg)}<div class="pf-tt"><h2>${esc(nm(tg))}</h2>`
        + `<div class="pf-role">${PV.from ? introText(r) : routeTitle(PV.routes, PV.idx)}</div></div></div>`;
  if(!PV.from)
    h += `<div class="rt-head"><span class="rt-m">${routeMeta(r)}${PV.routes.length > 1 ? " · " + fmt(T.routeOf, {i:PV.idx + 1, n:PV.routes.length}) : ""}</span></div>`
       + `<div class="rt-start">${svgI("person")} ${routeStart(r)}</div>`;
  if(PV.routes.length > 1)
    h += `<div class="rt-alts" role="tablist">` + PV.routes.map((rr, i) =>
      `<button class="rt-alt${i === PV.idx ? " on" : ""}" data-alt="${i}" role="tab" aria-selected="${i === PV.idx}">${altLabel(PV.routes, i)}</button>`).join("") + `</div>`;
  h += `<div class="rt-sum">${["confirmed", "unverified", "potential", "demo"].filter(c => r.cnt[c]).map(c => clsTag(c, r.cnt[c])).join("")}</div>`;
  if(!PV.from) h += routeActsHtml(tg, "data-act");
  h += `<div class="steps" id="steps">`;
  r.nodes.forEach((n, i) => {
    const last = i === r.nodes.length - 1, hop = r.hops[i];
    h += `<div class="step${n.kind === "me" ? " me" : ""}${last ? " last" : ""}${S.pathStep === i ? " on" : ""}" data-step="${i}"`
       + `${hop ? ` data-cls="${hop.cls}"` : ""} style="--c:${nodeColor(n)}">`
       + `<div class="rail"><span class="pin"></span></div><div class="card">`
       + `<div class="nm">${esc(n.kind === "me" ? n.name : nm(n))}${n.demo ? ` <span class="tag demo" style="min-height:18px;padding:0 6px">DEMO</span>` : ""}</div>`
       + `<div class="sub">${esc(subLine(n))}</div>`
       + (r.notes[i] === "shared" ? `<div class="note2">${T.sharedOrg}</div>` : "")
       + (hop ? `<div class="basis">${clsTag(hop.cls)}<span>${esc(hop.text)}${hop.src ? " · " + esc(hop.src) : ""}</span></div>` : "")
       + `</div></div>`;
  });
  h += `</div>`;
  h += `<div class="stepnav"><button class="btn sm" data-sn="-1" aria-label="${T.prev}">${svgI("chevL")} ${T.prev}</button>`
     + `<span class="pos" id="steppos">${S.pathStep < 0 ? fmt(T.stepsN, {n:r.nodes.length}) : fmt(T.stepOf, {i:S.pathStep + 1, n:r.nodes.length})}</span>`
     + `<button class="btn sm" data-sn="1" aria-label="${T.next}">${T.next} ${svgI("chevR")}</button></div>`;
  h += `<p class="disclaim">${T.routeDisclaim} ${r.strengthUsed ? T.rankStrength : T.rankBasic}</p>`;
  h += `<div class="actrow"><button class="btn" data-act="openTarget">${T.openProfile}</button><button class="btn ghost" data-act="clearPath">${T.clearPath}</button></div>`;
  dbody.innerHTML = h;
  dbody.scrollTop = 0;
  Sheets.setPeek(detailEl, dbody.querySelector(".rt-acts") || dbody.querySelector(".rt-sum") || dbody.querySelector(".pf-head"));
}
function stepPath(i){
  if(!S.path) return;
  const n = S.path.nodes.length;
  S.pathStep = Math.max(0, Math.min(n - 1, i));
  S.path.t0 = -1e9;                                   // stepping shows the whole route
  document.querySelectorAll(".step[data-step]").forEach(el => el.classList.toggle("on", +el.dataset.step === S.pathStep));
  const pos = document.getElementById("steppos");
  if(pos) pos.textContent = fmt(t().stepOf, {i:S.pathStep + 1, n});
  document.querySelectorAll(`.step[data-step="${S.pathStep}"]`).forEach(cur => {
    if(cur.offsetParent && cur.scrollIntoView) cur.scrollIntoView({block:"nearest", behavior:RM ? "auto" : "smooth"});
  });
  centerOn(S.path.nodes[S.pathStep], isMob() ? 1 : 0.95);
}
function renderNoRoute(target, reason){
  const T = t();
  PANEL_MODE = "noroute";
  S.selected = target; computeVisible();
  let h = `<div class="pf-head">${avatarHtml(target)}<div class="pf-tt"><h2>${esc(target.name)}</h2><div class="pf-role">${esc(subLine(target))}</div></div></div>`;
  if(reason === "noMe"){
    h += `<div class="callout"><b>${T.needStartTitle}</b><div style="margin-top:4px">${T.needStart}</div>`
       + `<div class="row"><button class="btn sm primary" data-act="locate">${svgI("userplus")} ${T.actAddSomeone}</button>`
       + `<button class="btn sm" data-act="demo">${svgI("sparkle")} ${T.tryDemo}</button></div>`
       + `<div class="row"><button class="btn sm ghost" data-act="armTo" data-id="${esc(target.id)}">${svgI("tap")} ${T.needStartPick}</button></div></div>`;
  } else {
    const g = groupOf(target);
    h += `<div class="callout"><b>${fmt(T.noRouteTitle, {name:esc(nm(target))})}</b><div style="margin-top:4px">${T.noRouteBody}</div>`
       + `<div class="row"><button class="btn sm primary" data-act="locate">${svgI("userplus")} ${T.addContacts}</button>`
       + (g >= 0 ? `<button class="btn sm" data-act="exploreInd" data-g="${g}">${fmt(T.exploreInd, {ind:esc(groupName(g))})}</button>` : "")
       + `</div><div class="row"><button class="btn sm ghost" data-act="armTo" data-id="${esc(target.id)}">${svgI("tap")} ${T.needStartPick}</button></div></div>`;
  }
  h += `<div class="actrow"><button class="btn" data-act="openTarget" data-id="${esc(target.id)}">${T.openProfile}</button></div>`;
  dbody.innerHTML = h;
  dbody.scrollTop = 0;
  Sheets.setPeek(detailEl, dbody.querySelector(".callout"));

}
function selectEdge(e){
  const T = t();
  S.selectedEdge = e; S.selected = null;
  clearPath();
  PANEL_MODE = "edge";
  const info = e.me ? hopInfo(e) : (e.kind === "pot" ? {cls:"potential", text:e.label} : hopInfo(e));
  let h = `<div class="eyebrow">${T.relTitle}</div><h2 style="font-family:var(--display);font-size:17px;margin-right:38px">`
        + `${esc(nm(e.s))} ↔ ${esc(nm(e.t))}</h2>`
        + `<div class="callout"><div class="basis" style="margin-top:0">${clsTag(info.cls)}<span>${esc(info.text)}${info.src ? " · " + esc(info.src) : ""}</span></div>`
        + (e.kind === "pot" ? `<div class="plab" style="margin-top:8px">${T.relPotential}</div>` : "")
        + (e.former ? `<div class="plab" style="margin-top:8px">${T.former}</div>` : "") + `</div>`;
  [e.s, e.t].forEach(n => {
    h += `<div class="conn" data-go="${esc(n.id)}" style="--c:${nodeColor(n)}"><span class="dot"></span><span>${esc(nm(n))}</span>`
       + `<span class="kind">${n.kind === "inst" ? T.inst : n.kind === "me" ? T.you : T.person}</span></div>`;

/* ---------- actions (one delegated handler for every panel button) ---------- */
function knowPerson(n){
  if(DEMO.on){ toast(t().exitDemoFirst, {action:t().exitDemo, fn:exitDemo}); return; }
  const res = Personal.addKnown(n.id);
  if(res.error) return;
  Acct.push();
  rebuildPersonal(true);
  const gain = REACH && REACH.delta > 0 ? REACH.delta : 0;
  toast(gain ? fmt(t().addedReach, {name:nm(n), n:gain}) : fmt(t().addedToNet, {name:nm(n)}), {action:t().undo, fn:() => { Personal.forget(n.id); Acct.push(); rebuildPersonal(false); refreshPanels(); }});
  refreshPanels();
}
function unknowPerson(n){
  Personal.forget(n.id);
  Acct.push();
  rebuildPersonal(false);
  toast(fmt(t().removedFromNet, {name:nm(n)}));
  refreshPanels();
}
function refreshPanels(){
  if(PANEL_MODE === "profile" && S.selected && nodes.includes(S.selected)) renderProfile(S.selected, true);
  if(myPanel.classList.contains("open")) renderMyPanel(true);
  if(Tour.active) Tour.refresh();
}
function exploreIndustry(g){
  clearFocus();
  S.hl = new Set([g]);
  Legend.refreshHl();
  if(S.view !== "sector") setView("sector", {quiet:true});
  computeVisible();
  setTimeout(() => fitDistrict(g, 800), RM ? 0 : 60);
}
function fitDistrict(g, ms){
  const d = DISTRICTS.find(x => x.gi === g);
  if(!d){ fitTargets(ms); return; }
  const r = d.r + 60;
  fitBox(d.cx - r, d.cy - r, d.cx + r, d.cy + r, {ms, maxK:1.3});
}
function armFrom(n, role){
  S.pathArm = {node:n, role};
  toast(role === "from" ? t().pathArmed : t().pickArmed, {ms:4000});
  if(isMob()) Sheets.setState(detailEl, "peek");
}
function onAction(act, el){
  const n = S.selected;
  const id = el.getAttribute("data-id");
  const node = id ? byId[id] : n;
  switch(act){
    case "path": if(n) showRoutes(n); break;
    case "know": if(n) knowPerson(n); break;
    case "unknow": if(n) unknowPerson(n); break;
    case "knowhere": if(n) openMyPanel({inst:n}); break;
    case "expand": if(n){ S.expanded.add(n); computeVisible(); renderProfile(n, true); fitNodes([...nbrs(n, new Set())], {ms:650, maxK:1.2}); } break;
    case "collapse": if(n){ S.expanded.delete(n); computeVisible(); renderProfile(n, true); } break;
    case "focus": if(n){ S.focus = S.focus === n ? null : n; reheat(0.4); computeVisible(); renderProfile(n, true); updateStats(); if(S.focus) fitNodes([...FOC], {ms:650}); } break;
    case "arm": if(n) armFrom(n, "from"); break;
    case "armTo": if(node) armFrom(node, "to"); break;
    case "locate": if(Tour.active) Tour.go(2); else openMyPanel({focus:"name"}); break;
    case "demo": enterDemo(); if(PANEL_MODE === "noroute" && node && node !== ME){ const r = showRoutes(node); if(!r) renderNoRoute(node, "none"); } break;
    case "exitDemo": exitDemo(); closeDetail(); break;
    case "mynet": openMyPanel(); break;
    case "pickTarget": closeDetail(); if(Tour.active) Tour.go(3); else { const a = document.getElementById("ask"); a.focus(); a.placeholder = t().whoMeet; } break;
    case "exploreInd": exploreIndustry(+el.getAttribute("data-g")); break;
    case "openTarget": { const tg = node && id ? node : (PV && PV.target); clearPath(); if(tg){ select(tg); centerOn(tg); } break; }
    case "clearPath": clearPath(); closeDetail(); break;
    case "explorePath": explorePath(); break;
    case "anotherRoute": anotherRoute(); break;
    case "saveTarget": { const tg = PANEL_MODE === "path" && PV ? PV.target : n; if(tg) Saved.toggle(tg); break; }
    case "ipPick": case "ipCopy": case "ipLink": case "ipWill": ipAction(act, el); break;
  }
}
dbody.addEventListener("click", ev => {
  const a = ev.target.closest("[data-act]");
  if(a){ onAction(a.getAttribute("data-act"), a); return; }
  const alt = ev.target.closest("[data-alt]");
  if(alt && PV){
    PV.idx = +alt.getAttribute("data-alt");
    setRoute(PV.routes[PV.idx]);
    renderPath();
    if(Tour.active) Tour.refresh();
    return;
  }
  const sn = ev.target.closest("[data-sn]");
  if(sn && S.path){ stepPath((S.pathStep < 0 ? (+sn.getAttribute("data-sn") > 0 ? -1 : 1) : S.pathStep) + +sn.getAttribute("data-sn")); return; }
  const st = ev.target.closest("[data-step]");
  if(st && S.path){ stepPath(+st.getAttribute("data-step")); return; }
  const go = ev.target.closest("[data-go]");
  if(go){
    const tg = byId[go.getAttribute("data-go")];
    if(tg){ select(tg); centerOn(tg); }
  }
});

/* ================================================================
   LEGEND — industries (highlight, multi-select, reset), connection
   styles, shapes, latest signals. Desktop: floating sidebar.
   Phone: a chip strip under the header + a "Map key" sheet.
   ================================================================ */
let NEWS_LOADED = false;
const Legend = (() => {
  const el = document.getElementById("legend");
  let CNT = null;
  function counts(){
    const c = SECTOR_GROUPS.map(() => 0);
    nodes.forEach(n => { if(n.layer) return; const g = groupOf(n); if(g >= 0) c[g]++; });
    return c;
  }
  function present(){ CNT = CNT || counts(); return SECTOR_GROUPS.map((g, i) => i).filter(i => CNT[i] > 0); }
  function indBtn(i){
    const g = SECTOR_GROUPS[i], on = S.hl.has(i);
    return `<button class="ind${on ? " on" : ""}" type="button" data-g="${i}" aria-pressed="${on}" style="${indVars(g.color)}">`
         + `<span class="ic">${svgI(g.icon)}</span><span class="nm">${esc(groupName(i))}</span><span class="ct">${CNT[i]}</span></button>`;
  }
  function lineKey(label, stroke, dash, w, glow){
    return `<div class="key"><svg width="30" height="10" viewBox="0 0 30 10" aria-hidden="true">`
         + (glow ? `<line x1="3" y1="5" x2="27" y2="5" stroke="rgba(124,140,255,.45)" stroke-width="6" stroke-linecap="round"/>` : "")
         + `<line x1="3" y1="5" x2="27" y2="5" stroke="${stroke}" stroke-width="${w || 1.6}"${dash ? ` stroke-dasharray="${dash}"` : ""} stroke-linecap="round"/></svg>`
         + `<span>${esc(label)}</span></div>`;
  }
  function shapeKey(label, svg){
    return `<div class="key"><svg width="30" height="16" viewBox="0 0 30 16" aria-hidden="true">${svg}</svg><span>${esc(label)}</span></div>`;
  }
  function connHtml(){
    const K = t().keyConn;
    return lineKey(K.role, "rgba(138,152,176,.95)")
      + lineKey(K.own, "rgba(164,178,202,.95)", null, 2.2)
      + lineKey(K.family, "rgba(214,178,132,.95)")
      + lineKey(K.ns, "rgba(138,152,176,.95)", "3 4")
      + lineKey(K.pot, "rgba(138,152,176,.95)", "1 4")
      + lineKey(K.former, "rgba(138,152,176,.6)", "5 4")
      + lineKey(K.mine, C.accent, null, 2.2)
      + lineKey(K.demo, "#F2B544", "7 3 2 3", 2)
      + lineKey(K.path, "#FFFFFF", null, 2.4, true);
  }
  function shapesHtml(){
    const K = t().keyShape, st = 'fill="rgba(157,169,187,.3)" stroke="#9DA9BB" stroke-width="1.5"';
    return shapeKey(K.person, `<circle cx="15" cy="8" r="6" ${st}/>`)
      + shapeKey(K.gov, `<rect x="9" y="2" width="12" height="12" rx="3.5" ${st}/>`)
      + shapeKey(K.sov, `<path d="M15 1.2l6.8 6.8-6.8 6.8L8.2 8z" ${st}/>`)
      + shapeKey(K.org, `<rect x="9.5" y="2.5" width="11" height="11" rx="1.6" ${st}/>`)
      + shapeKey(K.you, `<circle cx="15" cy="8" r="7.5" fill="#fff"/><circle cx="15" cy="8" r="5.3" fill="${C.accent}"/><circle cx="15" cy="6.8" r="1.6" fill="#fff"/>`)
      + shapeKey(K.reach, `<circle cx="15" cy="8" r="6.5" fill="none" stroke="${C.accent}" stroke-width="1.4" stroke-dasharray="3 3"/>`)
      + shapeKey(K.news, `<circle cx="15" cy="8" r="3.6" fill="${C.news}"/>`);
  }
  function render(){
    const T = t(), ps = present(), collapsed = el.classList.contains("collapsed");
    document.getElementById("lg-in").innerHTML =
        `<div class="lg-hd"><b>${T.lgTitle}</b><button class="linkbtn" type="button" data-lg="reset"${S.hl.size ? "" : " hidden"}>${T.lgReset}</button>`
      + `<button class="btn icon ghost sm lg-tg" type="button" data-lg="toggle" aria-expanded="${!collapsed}" aria-label="${T.lgToggle}">${svgI("chevD")}</button></div>`
      + `<div class="lg-body"><div class="inds${S.hl.size ? " has-on" : ""}" role="group" aria-label="${T.lgTitle}">${ps.map(indBtn).join("")}</div>`
      + `<p class="lg-hint">${T.lgHint}</p>`
      + `<div class="lg-sub">${T.lgConn}</div>${connHtml()}`
      + `<div class="lg-sub">${T.lgShapes}</div>${shapesHtml()}`
      + `<div class="lg-sub">${T.lgSignals}</div><div id="lg-sig"></div></div>`;
    renderSignals();
    renderStrip();
  }
  function renderSignals(){
    const box = document.getElementById("lg-sig");
    if(!box) return;
    const items = NEWS.filter(i => i.ids && i.ids.some(id => byId[id])).slice(0, 5);
    box.innerHTML = items.length
      ? items.map(i => `<button class="sig" type="button" data-sig="${esc(i.ids.find(id => byId[id]))}">${esc(i.title)}`
                     + `<small>${esc(i.date || "")}${i.source ? " · " + esc(i.source) : ""}</small></button>`).join("")
      : `<p class="lg-hint">${NEWS_LOADED ? t().noSignals : t().loadingSignals}</p>`;
  }
  function renderStrip(){
    const T = t();
    document.getElementById("chipstrip").innerHTML =
        `<button class="schip reset" type="button" data-lg="reset"${S.hl.size ? "" : " hidden"}>${T.lgReset}</button>`
      + present().map(i => {
          const g = SECTOR_GROUPS[i], on = S.hl.has(i);
          return `<button class="schip${on ? " on" : ""}" type="button" data-g="${i}" aria-pressed="${on}" style="${indVars(g.color)}">`
               + `<span class="ic">${svgI(g.icon)}</span>${esc(groupName(i))}</button>`;
        }).join("");
  }
  function refreshHl(){
    document.querySelectorAll(".ind[data-g],.schip[data-g],.tchip[data-g]").forEach(b => {
      const on = S.hl.has(+b.dataset.g);
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    document.querySelectorAll(".inds").forEach(x => x.classList.toggle("has-on", S.hl.size > 0));
    document.querySelectorAll('[data-lg="reset"]').forEach(b => { b.hidden = !S.hl.size; });
  }
  function changed(){
    computeVisible();
    refreshHl();
    if(S.hl.size === 1 && S.view === "sector") fitDistrict([...S.hl][0], 700);
    else if(S.hl.size && isMob()) fitNodes([...VIS].filter(n => S.hl.has(groupOf(n))), {ms:650, maxK:1.1});
    updateStats();
    if(Tour.active) Tour.onHl();
  }
  function toggle(i){ S.hl.has(i) ? S.hl.delete(i) : S.hl.add(i); changed(); }
  function reset(){ S.hl.clear(); changed(); }
  function setCollapsed(c){
    el.classList.toggle("collapsed", c);
    try { localStorage.setItem("nv_lg", c ? "c" : "o"); } catch(e){}
    const tg = el.querySelector(".lg-tg");
    if(tg) tg.setAttribute("aria-expanded", c ? "false" : "true");
    layoutChrome();
  }
  return {render, renderSignals, renderStrip, refreshHl, toggle, reset, setCollapsed, present};
})();
document.addEventListener("click", ev => {
  const g = ev.target.closest(".ind[data-g],.schip[data-g],.tchip[data-g]");
  if(g){ Legend.toggle(+g.dataset.g); return; }
  const lg = ev.target.closest("[data-lg]");
  if(lg){
    const a = lg.getAttribute("data-lg");
    if(a === "reset") Legend.reset();
    else if(a === "toggle") Legend.setCollapsed(!document.getElementById("legend").classList.contains("collapsed"));
    else if(a === "close") Sheets.close(document.getElementById("legend"));
    return;
  }
  const sg = ev.target.closest("[data-sig]");
  if(sg){ const n = byId[sg.getAttribute("data-sig")]; if(n){ if(isMob()) Sheets.close(document.getElementById("legend"), true); select(n); centerOn(n); } }
});

/* ---------- map controls ---------- */
function renderMapCtl(){
  const T = t(), K = T.ctl;
  const b = (c, icon, label, cls) => `<button type="button" data-c="${c}" class="${cls || ""}" title="${label}" aria-label="${label}">${svgI(icon)}</button>`;
  document.getElementById("mapctl").innerHTML =
      b("zin", "plus", K.zin, "desk") + b("zout", "minus", K.zout, "desk")
    + b("key", "layers", K.key, "mob")
    + b("center", "target", K.center) + b("fit", "fit", K.fit)
    + b("full", S.immersive ? "unfull" : "full", S.immersive ? K.unfull : K.full, S.immersive ? "on" : "");
}
function recenter(){
  if(S.path){ fitNodes(S.path.nodes, {ms:650, maxK:1.2}); return; }
  if(S.selected){ centerOn(S.selected); return; }
  if(ME){ fitNodes(meCluster(), {ms:650, maxK:1.15}); return; }
  fitView(600);
}
function fitContext(){
  if(S.path){ fitNodes(S.path.nodes, {ms:600, maxK:1.2}); return; }
  if(S.selected){ fitNodes([...nbrs(S.selected, new Set())].filter(n => VIS.has(n)), {ms:600, maxK:1.2}); return; }
  if(S.hl.size){ fitNodes([...VIS].filter(n => S.hl.has(groupOf(n))), {ms:600, maxK:1.1}); return; }
  fitView(600);
}
function toggleImmersive(){
  S.immersive = !S.immersive;
  document.body.classList.toggle("immersive", S.immersive);
  const de = document.documentElement;
  try {
    if(S.immersive && de.requestFullscreen && !document.fullscreenElement) de.requestFullscreen().catch(() => {});
    else if(!S.immersive && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  } catch(e){}
  renderMapCtl();
  setTimeout(resize, 150);
}
document.addEventListener("fullscreenchange", () => {
  if(!document.fullscreenElement && S.immersive){ S.immersive = false; document.body.classList.remove("immersive"); renderMapCtl(); }
});
document.getElementById("mapctl").addEventListener("click", ev => {
  const b = ev.target.closest("[data-c]");
  if(!b) return;
  const c = b.getAttribute("data-c");
  if(c === "zin") zoomBy(1.3);
  else if(c === "zout") zoomBy(1 / 1.3);
  else if(c === "key") Sheets.open(document.getElementById("legend"), "half");
  else if(c === "center") recenter();
  else if(c === "fit") fitContext();
  else if(c === "full") toggleImmersive();
});
function layoutChrome(){
  const lg = document.getElementById("legend");
  if(isMob()){ if(lg.classList.contains("open") && !Sheets.state(lg)) lg.classList.remove("open"); }
  else lg.classList.add("open");
  document.body.classList.toggle("lg-open", !isMob() && !lg.classList.contains("collapsed"));
}

/* ---------- toast + first-visit gesture hint ---------- */
function toast(msg, opts){
  if(typeof opts === "number") opts = {ms:opts};
  opts = opts || {};
  const el = document.getElementById("toast");
  el.innerHTML = `<span>${esc(msg)}</span>` + (opts.action ? `<button type="button">${esc(opts.action)}</button>` : "");
  if(opts.action) el.querySelector("button").onclick = () => { el.classList.remove("show"); if(opts.fn) opts.fn(); };
  el.classList.add("show");

function sName(s){ const T = t(); return s === "strong" ? T.mcStrong : s === "medium" ? T.mcMedium : s === "weak" ? T.mcWeak : T.mcUnrated; }

function personSearch(q, inst, limit){
  const qt = Personal.toks(q);
  let pool = nodes.filter(n => n.kind === "person" && !n.layer);
  if(inst) pool = pool.filter(p => (p.roles || []).some(r => r[0] === inst.id && !r[4]));
  if(!qt.length) return inst ? pool.sort((a, b) => b.power - a.power).slice(0, limit || 12) : [];
  const out = [];
  pool.forEach(p => {
    let best = 0;
    [p.name].concat(AKAS[p.id] || []).forEach(v => {
      const nt = Personal.toks(v);
      if(qt.every(w => nt.some(x => x.startsWith(w)))){
        const s = nt.join(" ") === qt.join(" ") ? 100 : (nt[0] && nt[0].startsWith(qt[0]) ? 80 : 60);
        if(s > best) best = s;
      }
    });
    if(best) out.push({p, s:best + p.power / 100});
  });
  return out.sort((a, b) => b.s - a.s).slice(0, limit || 8).map(x => x.p);
}
const NAME_FILLER = new Set(["al", "bin", "bint", "ibn", "el", "abu", "bn"]);
function dupKey(p){
  const ts = Personal.toks(p.name).filter(w => !NAME_FILLER.has(w));

function loadSheetJS(){
  return new Promise((res, rej) => {
    if(window.XLSX) return res();
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = () => res(); s.onerror = () => rej(new Error("xlsx lib"));
    document.head.appendChild(s);
  });
}
function handleImportFile(f, after){
  const T = t();
  if(!f) return;
  const isX = /\.xlsx?$/i.test(f.name);
  const rd = new FileReader();
  rd.onerror = () => after({cls:"err", html:T.importErrRead});
  rd.onload = async () => {
    let text;
    try {
      if(isX){
        await loadSheetJS();
        const wb = window.XLSX.read(rd.result, {type:"array"});
        text = window.XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]);
      } else text = String(rd.result);
    } catch(e){ after({cls:"err", html:T.importErrXlsx}); return; }
    let res = null;
    try { res = Personal.importCSV(text); } catch(e){ res = null; }
    if(!res){ after({cls:"err", html:T.importErrFormat}); return; }
    if(!res.added && !res.dup){ after({cls:"err", html:T.importErrEmpty}); return; }
    leaveDemoQuietly();
    Acct.push();
    rebuildPersonal(true);
    const st = Personal.stats();
    after({cls:"ok", html:fmt(res.added ? T.importOk : T.importDup, {added:res.added, dup:res.dup, matched:st ? st.matched : 0, review:st ? st.review : 0})});
  };
  isX ? rd.readAsArrayBuffer(f) : rd.readAsText(f);
}

      renderMyPanel(true);

    else if(act === "delete"){
      if(!window.confirm(T.mpDeleteConfirm)) return;
      Acct.deleteRemote(); Personal.wipe(); Saved.wipe(); rebuildPersonal(false);
      MP.result = {cls:"info", html:T.mpDeleted}; renderMyPanel();
    }
    return;
  }
  const dec = ev.target.closest("[data-dec]");
  if(dec){ Personal.decide(dec.getAttribute("data-ci"), dec.getAttribute("data-dec") === "1"); Acct.push(); rebuildPersonal(false); renderMyPanel(true); return; }
  const chipF = ev.target.closest(".mc-chip");
  if(chipF){ MP.mcFilter = chipF.getAttribute("data-f"); renderMyPanel(true); return; }
  const go = ev.target.closest("[data-go-p]");
  if(go){ const n = byId[go.getAttribute("data-go-p")]; if(n){ Sheets.close(myPanel, true); select(n); centerOn(n); } return; }
  const svr = ev.target.closest("[data-sv]");
  if(svr){ const n = byId[svr.getAttribute("data-sv")]; if(n){ Sheets.close(myPanel, true); showRoutes(n); } return; }
  const s = ev.target.closest(".mc-s");
  if(s){ Personal.setRel(+s.closest(".mc-edit").getAttribute("data-ecid"), {s:s.getAttribute("data-s")}); Acct.push(); rebuildPersonal(false); renderMyPanel(true); return; }
  const sv = ev.target.closest(".mc-save");
  if(sv){
    const ed = sv.closest(".mc-edit");
    Personal.setRel(+ed.getAttribute("data-ecid"), {tags:ed.querySelector(".mc-tags-in").value.split(/[,;，]/), note:ed.querySelector(".mc-note-in").value});
    Acct.push(); toast(T.mcSaved); renderMyPanel(true); return;
  }
  const rm = ev.target.closest(".mc-rm");
  if(rm){ Personal.removeContact(+rm.closest(".mc-edit").getAttribute("data-ecid")); Acct.push(); rebuildPersonal(false); MP.mcOpen = null; renderMyPanel(true); toast(T.mcRemoved); return; }
  const row = ev.target.closest(".mc-row");
  if(row){ const cid = +row.getAttribute("data-cid"); MP.mcOpen = MP.mcOpen === cid ? null : cid; renderMyPanel(true); }
});

/* ================================================================
   SAVED TARGETS — people you want to reach, kept in this browser.
   When someone you add opens (or shortens) a path to one, you hear
   about it right away.
   ================================================================ */
const Saved = (() => {
  const K = "nv_saved_" + (location.pathname.split("/").filter(Boolean)[0] || "root");
  let ids = [], best = new Map();               // id → introductions on the best route, -1 = none
  try { ids = JSON.parse(localStorage.getItem(K) || "[]").filter(id => byId[id]); } catch(e){ ids = []; }
  const save = () => { try { localStorage.setItem(K, JSON.stringify(ids)); } catch(e){} };
  const has = n => !!n && ids.includes(n.id);
  const list = () => ids.map(id => byId[id]).filter(Boolean);
  const route = n => ME ? findRoutes(n, 1).routes[0] || null : null;
  function snapshot(){ best = new Map(list().map(n => { const r = route(n); return [n.id, r ? r.intros : -1]; })); }
  function toggle(n){
    if(!n || n.layer) return;
    const T = t();
    if(has(n)){ ids = ids.filter(id => id !== n.id); save(); toast(fmt(T.unsavedToast, {name:nm(n)})); }
    else {
      ids.push(n.id); save();
      const r = route(n); best.set(n.id, r ? r.intros : -1);
      toast(fmt(r ? T.savedToast : T.savedToastNo, {name:nm(n)}), {ms:4200});
    }
    refreshPanels();
    if(PANEL_MODE === "path") renderPath();
  }
  function checkNew(){
    if(!ids.length || DEMO.on){ snapshot(); return; }
    const T = t();
    for(const n of list()){
      const r = route(n), before = best.has(n.id) ? best.get(n.id) : -1;
      if(r && (before < 0 || r.intros < before)){
        snapshot();
        setTimeout(() => toast(fmt(before < 0 ? T.newPathToast : T.closerToast, {name:nm(n), n:r.intros}),
                               {action:T.showRoute, ms:7000, fn:() => { if(Tour.active) Tour.finish("explore"); showRoutes(n); }}), RM ? 0 : 3200);
        return;
      }
    }
    snapshot();
  }
  function wipe(){ ids = []; save(); best.clear(); }
  function html(){
    const T = t(), L = list();
    if(!L.length) return "";
    return `<div class="sect">${svgI("star")} ${T.savedTitle} (${L.length})</div>` + L.map(n => {
      const r = route(n);
      return `<div class="sv-row" data-sv="${esc(n.id)}">${avatarHtml(n, "sm")}<span class="tx"><b>${esc(nm(n))}</b><span>${esc(subLine(n))}</span></span>`
           + `<span class="st${r ? "" : " none"}">${r ? introText(r) : T.savedNoRoute}</span></div>`;
    }).join("");
  }
  return {has, list, toggle, checkNew, snapshot, wipe, html};
})();

/* ================================================================
   NUDGES — one quiet next step at a time, chosen from where you are:
   "Start with someone you know" → "One connection can open many
   doors" → "X is 2 introductions away". Never during the tour or over
   an open panel; each can be dismissed for a week.
   ================================================================ */
const Nudge = (() => {
  const el = document.getElementById("nudge"), K = "nv_nz_";
  let cur = null, timer = null, on = false, sgc = null;
  function dismissed(kind){ try { const v = +localStorage.getItem(K + kind); return !!v && Date.now() - v < 7 * 864e5; } catch(e){ return false; } }
  function suggestion(){ if(!sgc || sgc.me !== ME) sgc = {me:ME, s:suggestTargets(1)[0] || null}; return sgc.s; }
  function pick(){
    const T = t();
    if(Tour.active || Intro.on || DEMO.on || S.path || S.pathArm) return null;
    if(document.querySelector("#detail.open, #mypanel.open, #filters.open, #tour.open") || (isMob() && document.querySelector("#legend.open"))) return null;
    if(!ME) return dismissed("start") ? null : {kind:"start", icon:"userplus", text:T.nzStart, cta:T.nzStartCta, fn:() => openMyPanel({focus:"name"})};
    if(meAnchors().length === 1 && !dismissed("more")) return {kind:"more", icon:"plus", text:T.nzMore, cta:T.nzMoreCta, fn:() => openMyPanel({focus:"name"})};
    if(!dismissed("reach")){
      const sg = suggestion();
      if(sg) return {kind:"reach", icon:"route", text:fmt(sg.r.intros === 1 ? T.nzReach1 : T.nzReachN, {name:shortName(sg.p), n:sg.r.intros}),
                     cta:T.nzReachCta, fn:() => showRoutes(sg.p)};
    }
    return null;
  }
  function render(n){
    if(!n){ if(cur){ el.classList.remove("show"); cur = null; document.body.classList.remove("nudging"); } return; }
    if(cur && cur.kind === n.kind && cur.text === n.text) return;
    cur = n;
    el.innerHTML = `<span class="nz-ic">${svgI(n.icon)}</span><span class="nz-t">${esc(n.text)}</span>`
      + `<button class="nz-go" type="button">${esc(n.cta)} ${svgI("chevR")}</button>`
      + `<button class="nz-x" type="button" aria-label="${t().nzDismiss}" title="${t().nzDismiss}">${svgI("close")}</button>`;
    el.querySelector(".nz-go").onclick = () => { render(null); n.fn(); };
    el.querySelector(".nz-x").onclick = () => { try { localStorage.setItem(K + n.kind, String(Date.now())); } catch(e){} render(null); };
    requestAnimationFrame(() => el.classList.add("show"));
    document.body.classList.add("nudging");
  }
  function update(){ if(!on) return; clearTimeout(timer); timer = setTimeout(() => render(pick()), 500); }
  function start(){ if(on) return; on = true; update(); setInterval(() => { if(!document.hidden) render(pick()); }, 1500); }
  return {update, start, get current(){ return cur; }};
})();

/* ================================================================
   INTRO — Act I, first visit only: "A world of connections."
   The network unfolds from the center while you read; one tap flies
   you in and the guide begins. No sign-up, no form.
   ================================================================ */
const Intro = (() => {
  const el = document.getElementById("intro");
  let on = false;
  function show(){
    const T = t();
    on = true; S.intro = true;
    el.innerHTML = `<div class="in-card"><div class="in-eyebrow">NavGCC · ${esc(regionLabel())}</div>`
      + `<h1 id="intro-t">${T.introTitle}</h1><p class="in-l1">${T.introL1}</p><p class="in-l2">${T.introL2}</p>`
      + `<div class="in-row"><button class="btn primary in-go" type="button" data-in="go">${T.introGo} ${svgI("chevR")}</button>`
      + `<button class="btn" type="button" data-in="demo">${svgI("sparkle")} ${T.tryDemo}</button></div>`
      + `<p class="in-note">${T.introNote}</p></div>`;
    el.hidden = false;
    document.body.classList.add("intro");
    if(S.lite) computeLiteSet(240);              // a fuller constellation on phones, still light enough to animate
    if(S.view !== "sector") setView("sector", {quiet:true});
    computeVisible();
    for(let i = 0; i < 240; i++) physStep();
    fitTargets(0);
    S.cam.k *= isMob() ? 0.92 : 0.62;
    if(!RM) S.reveal = {t0:performance.now()};
    setTimeout(() => { const b = el.querySelector(".in-go"); if(b && !isMob()) b.focus({preventScroll:true}); }, 400);
  }
  function hide(then){
    if(!on) return;
    on = false; S.reveal = null; S.intro = false; MOUSE = null;
    if(S.lite) computeLiteSet();
    el.classList.add("out");
    document.body.classList.remove("intro");
    setTimeout(() => { el.hidden = true; el.classList.remove("out"); el.innerHTML = ""; }, RM ? 0 : 420);
    if(then) then();
  }
  el.addEventListener("click", ev => {
    const b = ev.target.closest("[data-in]");
    if(b && b.dataset.in === "demo"){ hide(() => { enterDemo({silent:true}); Tour.start(); }); return; }
    if(b || !ev.target.closest(".in-card")) hide(() => Tour.start());
  });
  return {show, hide, get on(){ return on; }};
})();

/* ================================================================
   GUIDED TOUR — Navigate → Locate yourself → Find your path.
   It drives the real map (no screenshots): industries as districts,
   your node appearing, and a route animating hop by hop. Shown once;
   "Guide" replays it. Next / Back / Skip / Replay on every step.
   ================================================================ */
const Tour = (() => {
  const el = document.getElementById("tour");
  const K = "nv_tour_v1";
  let cur = 1, active = false, timers = [], status = "", tab = "name", target = null, mini = null, tq = "", liRes = null, sgCache = null;
  let start2 = null, more = false, shownReach = 0;     // step 2: chosen way in, "add another" open, reach number on screen
  const TQ = {q:"", inst:null};
  const later = (ms, fn) => { if(RM) fn(); else timers.push(setTimeout(fn, ms)); };
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  function seen(){ try { return localStorage.getItem(K) === "done"; } catch(e){ return true; } }
  function mark(){ try { localStorage.setItem(K, "done"); } catch(e){} }
  function inner(){ return document.getElementById("tour-in"); }
  function start(o){
    o = o || {};
    active = true; cur = o.step || 1; status = ""; target = null; mini = null; tq = ""; liRes = null; start2 = null; more = false;
    S.selected = null; S.pathArm = null; clearPath(); closeDetail();
    ["mypanel", "filters"].forEach(id => Sheets.close(document.getElementById(id), true));
    document.body.classList.add("touring");
    render();
    Sheets.open(el, isMob() ? "half" : null);
    play();
  }
  function finish(how){
    if(!active) return;
    clear();
    active = false; mark();
    S.hideMe = false; S.pulse = null; S.dimGoal = 1; fadeEdges(1, 0);
    if(isMob() && S.selected && PANEL_MODE !== "profile") S.selected = null;
    document.body.classList.remove("touring");
    Sheets.close(el, true);
    computeVisible();
    if(how === "skip") toast(t().tourSkipped, {ms:3600});
    else if(how === "done") toast(t().tourDone, {ms:4200});
    else if(how === "guest") toast(t().guestToast, {ms:4600});
    setTimeout(maybeHint, how === "explore" ? 300 : 4600);
    Nudge.update();
  }
  el._onclose = () => { if(active) finish("skip"); };
  function go(n){
    clear();
    cur = Math.max(1, Math.min(3, n)); status = ""; mini = null; liRes = null; start2 = null; more = false;
    S.selected = null; S.pathArm = null; S.dimGoal = 1;
    if(cur !== 3){ clearPath(); target = null; }
    closeDetail();
    render();
    Sheets.open(el, isMob() ? "half" : null);
    play();
  }
  function play(){ clear(); if(cur === 1) playNavigate(); else if(cur === 2) playLocate(); else playPath(); }
  function featuredGroup(){
    const gov = SECTOR_GROUPS.findIndex(g => g.sectors.includes("gov"));
    const ds = DISTRICTS.slice().sort((a, b) => b.n - a.n);
    const d = ds.find(x => x.gi !== gov) || ds[0];
    return d ? d.gi : 0;
  }
  function topOf(gi){
    return nodes.filter(n => !n.layer && groupOf(n) === gi && VIS.has(n)).sort((a, b) => b.power - a.power)[0] || null;
  }
  /* step 1: overview of the industry districts → zoom into one → reveal people, organizations, links */
  function playNavigate(){
    S.selected = null; clearPath(); closeDetail(); S.focus = null; S.expanded.clear(); S.pulse = null;
    S.hideMe = true; S.hl.clear(); Legend.refreshHl(); S.dimGoal = 1;
    if(S.view !== "sector") setView("sector", {quiet:true});
    computeVisible();
    for(let i = 0; i < 240; i++) physStep();
    fadeEdges(0, RM ? 0 : 350);
    fitTargets(RM ? 0 : 900);
    later(1500, () => {
      const gi = featuredGroup();
      S.hl = new Set([gi]); Legend.refreshHl(); computeVisible();
      fitDistrict(gi, 1100);
      render();
    });
    later(2800, () => fadeEdges(1, 1000));
    later(3900, () => {
      const gi = [...S.hl][0];
      S.pulse = gi !== undefined ? topOf(gi) : null;
      computeVisible(); render();
    });
  }
  /* step 2: you appear and connect to the people you add */
  function playLocate(){
    S.hideMe = false; S.pulse = null; S.hl.clear(); Legend.refreshHl(); fadeEdges(1, 0);
    S.dimGoal = ME ? 1 : 0.32;                   // the network steps back; an empty starting point waits
    computeVisible();
    if(ME){
      if(!RM) ME.born = performance.now();
      setTimeout(() => fitNodes(meCluster(), {ms:850, maxK:1.15}), RM ? 0 : 50);
    } else fitTargets(800);
  }
  /* step 3: pick someone; the default route animates, alternatives are one tap away */
  function playPath(){
    S.hideMe = false; S.pulse = null; S.hl.clear(); Legend.refreshHl(); fadeEdges(1, 0);
    computeVisible();
    if(!ME){ fitTargets(700); return; }
    if(target){ runTarget(target); return; }
    if(DEMO.on){ const sg = suggestions()[0]; if(sg) later(800, () => { if(active && cur === 3 && !target) runTarget(sg.p); }); }
    setTimeout(() => fitNodes(meCluster(), {ms:700, maxK:1.1}), RM ? 0 : 50);
  }
  function suggestions(){
    if(!sgCache || sgCache.me !== ME) sgCache = {me:ME, list:suggestTargets(3)};
    return sgCache.list;
  }
  function runTarget(p){
    target = p; tq = "";
    const res = findRoutes(p, 4);
    if(!res.routes.length){
      status = "noroute"; clearPath(); render();
      fitNodes([p, ME].filter(Boolean), {ms:700});
      return;
    }
    PV = {routes:res.routes, idx:0, target:p};
    status = "route";
    if(!isMob()){ renderPath(); openDetail(); }
    render();
    setRoute(res.routes[0]);
  }
  function onNodeTap(n){
    if(!active) return false;
    if(cur === 3 && ME && n !== ME && !n.layer && !(n.kind === "person" && n.myDirect)){ runTarget(n); return true; }
    status = "tapped"; mini = n;
    if(isMob()){ S.selected = n; computeVisible(); centerOn(n, 0.95); render(); return true; }
    render();
    return false;                                   // desktop: open the real profile alongside
  }
  function onHl(){ if(active && cur === 1){ status = "hl"; render(); } }
  function onPersonal(){ sgCache = null; if(active){ if(cur === 2 && ME){ status = "located"; S.dimGoal = 1; } render(); } }
  function onDetailClosed(){ if(active && mini){ mini = null; render(); } }

  /* ---------- card ---------- */
  function stepsHtml(){
    const T = t(), names = [T.tour1, T.tour2, T.tour3];
    return `<div class="tsteps">` + names.map((s, i) =>
      `${i ? '<span class="sp-line"></span>' : ""}<button class="sp${cur === i + 1 ? " on" : cur > i + 1 ? " done" : ""}" type="button" data-tgo="${i + 1}"`
      + ` aria-current="${cur === i + 1 ? "step" : "false"}"><i>${cur > i + 1 ? "✓" : i + 1}</i><span>${s}</span></button>`).join("") + `</div>`;
  }
  function miniHtml(n){
    return `<div class="mini">${avatarHtml(n)}<span class="tx"><b>${esc(nm(n))}</b><span>${esc(subLine(n))}</span></span></div>`;
  }
  function navHtml(){
    const T = t();
    let h = `<h3>${T.t1Title}</h3><p class="lead">${T.t1Lead}</p><p class="tsmall">${fmt(T.t1Body, {region:esc(regionLabel())})}</p>`;
    h += `<div class="tchips" role="group" aria-label="${T.lgTitle}">` + Legend.present().map(i => {
      const g = SECTOR_GROUPS[i], on = S.hl.has(i);
      return `<button class="tchip${on ? " on" : ""}" type="button" data-g="${i}" aria-pressed="${on}" style="${indVars(g.color)}"><span class="ic">${svgI(g.icon)}</span>${esc(groupName(i))}</button>`;
    }).join("") + `</div>`;
    if(status === "tapped" && mini) h += miniHtml(mini) + `<div class="tstatus">${svgI("check")}<span>${T.t1Tapped}</span></div>`;
    else if(status === "hl") h += `<div class="tstatus">${svgI("check")}<span>${T.t1Hl}</span></div>`;
    else h += `<div class="hintline">${svgI("tap")}<span>${T.t1Try}</span></div>`;
    return h;
  }
  function optBtn(k, ic, title, sub, cls){
    return `<button class="opt-b${cls ? " " + cls : ""}" type="button" data-topt="${k}"><span class="oi">${svgI(ic)}</span>`
         + `<span><b>${title}</b><span class="os">${sub}</span></span>${svgI("chevR")}</button>`;
  }
  function reachHtml(){
    const T = t();
    if(!REACH) return "";
    const d = REACH.via && REACH.delta > 0 ? `<span class="rc-delta">${fmt(T.reachDelta, {n:REACH.delta, name:esc(REACH.via.short || nm(REACH.via))})}</span>` : "";
    const top = REACH.top.length ? `<p class="rc-top">${fmt(T.reachSub, {names:REACH.top.map(n => `<button class="linkbtn" type="button" data-tpick="${esc(n.id)}">${esc(shortName(n))}</button>`).join(", ")})}</p>` : "";
    return `<div class="reachbox"><div class="rc-num"><b data-to="${REACH.n}">${shownReach}</b><span>${T.reachLbl}</span>${d}</div>`
         + top + `<p class="tsmall">${T.reachNote}</p></div>`;
  }
  function addUiHtml(){
    const T = t();
    let h = `<div class="seg" role="tablist" style="margin-top:12px"><button type="button" role="tab" data-ttab="name" class="${tab === "name" ? "on" : ""}">${T.tabName}</button>`
       + `<button type="button" role="tab" data-ttab="li" class="${tab === "li" ? "on" : ""}">${T.tabLinkedIn}</button></div>`;
    h += tab === "name" ? addByNameHtml("tr", TQ) : linkedInHtml("tr");
    if(liRes) h += `<div class="result ${liRes.cls}" role="status">${liRes.html}</div>`;
    return h;
  }
  /* step 2 (act II): every network has a starting point → you appear → "the map becomes yours" */
  function locHtml(){
    const T = t();
    const tapped = (status === "tapped" && mini && mini.kind === "person" && !mini.layer && !mini.myDirect && !DEMO.on)
      ? miniHtml(mini) + `<div class="actrow"><button class="btn sm" type="button" data-tknow="${esc(mini.id)}">${svgI("userplus")} ${T.actKnow}</button></div>` : "";
    if(ME){
      const a = meAnchors();
      let h = `<div class="yours"><span class="y-badge">${svgI("check")} ${DEMO.on ? T.yoursDemo : T.yoursBadge}</span>`
            + `<h3>${T.yoursTitle}</h3><p class="lead">${T.yoursLead}</p></div>` + reachHtml();
      if(DEMO.on)
        return h + `<div class="result info">${T.t2Demo}</div><div class="cchips">`
                 + a.map(n => `<span class="cchip demo">${esc(n.name)} · ${esc(subLine(n))}</span>`).join("") + `</div>`;
      h += a.length
        ? `<div class="cchips">` + a.slice(0, 10).map(n => `<span class="cchip">${esc(n.short)}<button type="button" data-unknow="${esc(n.id)}" aria-label="${T.remove} ${esc(n.short)}">${svgI("close")}</button></span>`).join("") + `</div>`
        : `<div class="tstatus">${svgI("check")}<span>${fmt(T.t2LocatedOrg, {n:ME.adj.length})}</span></div>`;
      h += `<div class="doors"><span>${T.moreDoors}</span>`
         + (more ? `</div>` + addUiHtml() : `<button class="btn sm primary" type="button" data-tmore="1">${svgI("plus")} ${T.addAnother}</button></div>`);
      return h + tapped;
    }
    let h = `<h3>${T.t2Title}</h3><p class="lead">${T.t2Lead}</p>`;
    if(!start2)
      return h + `<div class="opts">` + optBtn("li", "link", T.optLi, T.optLiSub) + optBtn("name", "userplus", T.optName, T.optNameSub)
               + optBtn("guest", "compass", T.optGuest, T.optGuestSub, "ghosty") + `</div>` + tapped;
    h += addUiHtml() + tapped;
    h += `<div class="hintline">${svgI("info")}<span><button class="linkbtn" type="button" data-topt="back">${T.t2Back}</button> · `
       + `<button class="linkbtn" type="button" data-topt="guest">${T.optGuest}</button></span></div>`;
    return h;
  }
  function routeHtml(){
    const T = t(), r = PV.routes[PV.idx];
    let h = `<div class="callout access"><div class="rt-head"><span class="rt-t">${routeTitle(PV.routes, PV.idx)}</span>`
          + `<span class="rt-m">${esc(nm(PV.target))} · ${routeMeta(r)}</span></div>`
          + `<div class="rt-start">${svgI("person")} ${routeStart(r)}</div>`;
    if(PV.routes.length > 1)
      h += `<div class="rt-alts">` + PV.routes.map((rr, i) => `<button class="rt-alt${i === PV.idx ? " on" : ""}" type="button" data-talt="${i}">${altLabel(PV.routes, i)}</button>`).join("") + `</div>`;
    h += `<div class="rt-sum">${["confirmed", "unverified", "potential", "demo"].filter(c => r.cnt[c]).map(c => clsTag(c, r.cnt[c])).join("")}</div>`;
    if(isMob()){
      h += `<div class="steps">` + r.nodes.map((n, i) => {
        const hop = r.hops[i], last = i === r.nodes.length - 1;
        return `<div class="step${n.kind === "me" ? " me" : ""}${last ? " last" : ""}${S.pathStep === i ? " on" : ""}" data-step="${i}"${hop ? ` data-cls="${hop.cls}"` : ""} style="--c:${nodeColor(n)}">`
             + `<div class="rail"><span class="pin"></span></div><div class="card"><div class="nm">${esc(n.kind === "me" ? n.name : nm(n))}</div><div class="sub">${esc(subLine(n))}</div>`

  function pathHtml(){

    let h = `<h3>${T.t3Title}</h3><p class="lead">${T.t3Lead}</p>`;

    if(status === "route" && PV && PV.target === target) h += routeHtml();
    else if(status === "noroute" && target){
      const g = groupOf(target);
      h += `<div class="callout"><b>${fmt(T.noRouteTitle, {name:esc(nm(target))})}</b><div style="margin-top:4px">${T.noRouteBody}</div>`
         + `<div class="row"><button class="btn sm primary" type="button" data-tgo="2">${svgI("userplus")} ${T.addContacts}</button>`
         + (g >= 0 ? `<button class="btn sm" type="button" data-tind="${g}">${fmt(T.exploreInd, {ind:esc(groupName(g))})}</button>` : "") + `</div></div>`;
    } else {
      const sg = suggestions();
      if(sg.length) h += `<div class="plab" style="margin-top:12px">${T.t3Suggested}</div><div class="pr-list">` + sg.map(x =>
        `<button class="pr" type="button" data-tpick="${esc(x.p.id)}">${avatarHtml(x.p)}<span class="tx"><b>${esc(x.p.name)}</b><span>${esc(subLine(x.p))}</span></span>`
        + `<span class="add">${svgI("route")} ${T.showPath}</span></button>`).join("") + `</div>`;
    }
    h += `<div class="hintline">${svgI("tap")}<span>${T.t3Tap}</span></div>`;
    return h;
  }
  function targetRows(q){
    const T = t();
    const list = personSearch(q, null, 6).filter(p => !p.myDirect);
    return list.length ? list.map(p => `<button class="pr" type="button" data-tpick="${esc(p.id)}">${avatarHtml(p)}<span class="tx"><b>${esc(p.name)}</b><span>${esc(subLine(p))}</span></span><span class="add">${svgI("route")} ${T.showPath}</span></button>`).join("")
                       : `<p class="empty">${fmt(T.noNameMatch, {q:esc(q)})}</p>`;
  }
  function render(){
    if(!active) return;
    const T = t(), box = inner();
    const keep = box.querySelector(".tbody") ? box.querySelector(".tbody").scrollTop : 0;
    const body = cur === 1 ? navHtml() : cur === 2 ? locHtml() : pathHtml();
    box.innerHTML = stepsHtml().replace(/<\/div>$/, `<button class="skip" type="button" data-t="skip">${T.skipTour}</button></div>`) + `<div class="tbody">${body}</div>`
      + `<div class="tfoot"><button class="btn sm ghost" type="button" data-t="replay" title="${T.replayHint}" aria-label="${T.replay}">${svgI("replay")}<span class="lbl"> ${T.replay}</span></button>`
      + (DEMO.on ? `<button class="btn sm ghost" type="button" data-t="exitDemo" style="color:var(--warn-ink)">${T.exitDemo}</button>`
                 : `<button class="btn sm ghost" type="button" data-t="demo">${svgI("sparkle")} ${T.tryDemo}</button>`)
      + `<span class="grow"></span>`
      + `<button class="btn sm" type="button" data-t="back"${cur === 1 ? " disabled" : ""}>${svgI("chevL")} ${T.back}</button>`
      + `<button class="btn sm primary" type="button" data-t="next">${cur === 3 ? T.finish : T.next}${cur === 3 ? "" : " " + svgI("chevR")}</button></div>`;
    box.querySelector(".tbody").scrollTop = keep;
    if(cur === 2 && !DEMO.on){
      if(tab === "name") wireAddByName("tr", TQ);
      else wireLinkedIn("tr", r => { liRes = r; render(); });
    }
    if(cur === 3){
      const inp = document.getElementById("tt-q"), res = document.getElementById("tt-res");
      if(inp){
        inp.oninput = () => { tq = inp.value; res.innerHTML = tq.trim() ? targetRows(tq.trim()) : ""; };
        if(tq.trim()) res.innerHTML = targetRows(tq.trim());
      }
    }
    Sheets.setPeek(el, box.querySelector("h3"));
    Sheets.sync();
    const rn = box.querySelector(".rc-num b[data-to]");
    if(rn){ const to = +rn.dataset.to; countUp(rn, shownReach, to); shownReach = to; }
  }
  function focusAdd(){ if(isMob()) return; setTimeout(() => { const i = document.getElementById("tr-q"); if(i) i.focus(); }, 60); }
  el.addEventListener("click", ev => {
    const b = ev.target.closest("[data-t],[data-tgo],[data-ttab],[data-tpick],[data-talt],[data-unknow],[data-tknow],[data-tind],[data-step],[data-topt],[data-tmore]");
    if(!b) return;
    const d = b.dataset;
    if(d.topt){
      if(d.topt === "guest") finish("guest");
      else if(d.topt === "back"){ start2 = null; liRes = null; render(); }
      else { start2 = d.topt; tab = d.topt; liRes = null; render(); if(tab === "name") focusAdd(); }
      return;
    }
    if(d.tmore){ more = true; tab = "name"; render(); focusAdd(); return; }
    if(d.t){
      const a = d.t;
      if(a === "explorePath"){ explorePath(); return; }
      if(a === "anotherRoute"){ anotherRoute(); return; }
      if(a === "saveTarget"){ if(PV) Saved.toggle(PV.target); render(); return; }
      if(a === "skip") finish("skip");
      else if(a === "next"){ if(cur === 3) finish("done"); else go(cur + 1); }
      else if(a === "back") go(cur - 1);
      else if(a === "replay"){ if(cur === 3 && target) runTarget(target); else play(); }
      else if(a === "demo"){ enterDemo(); go(cur === 1 ? 2 : cur); }
      else if(a === "exitDemo"){ exitDemo(); target = null; status = ""; render(); }
      else if(a === "explore") finish("explore");
      else if(a === "retarget"){ status = ""; render(); const inp = document.getElementById("tt-q"); if(inp) inp.focus(); }
      return;
    }
    if(d.tgo){ go(+d.tgo); return; }
    if(d.ttab){ tab = d.ttab; liRes = null; render(); return; }
    if(d.tpick){ const p = byId[d.tpick]; if(p){ if(cur === 3) runTarget(p); else { target = p; go(3); } } return; }
    if(d.talt !== undefined && PV){ PV.idx = +d.talt; setRoute(PV.routes[PV.idx]); if(!isMob()) renderPath(); render(); return; }
    if(d.unknow){ const p = byId[d.unknow]; if(p) unknowPerson(p); return; }
    if(d.tknow){ const p = byId[d.tknow]; if(p){ knowPerson(p); mini = null; } return; }
    if(d.tind){ finish("explore"); exploreIndustry(+d.tind); return; }
    if(d.step !== undefined && S.path){ stepPath(+d.step); return; }
  });
  return {start, finish, go, seen, onNodeTap, onHl, onPersonal, onDetailClosed, refresh:render,
          get active(){ return active; }, get step(){ return cur; }};
})();

const askIn = document.getElementById("ask"), askOut = document.getElementById("askout");
function askResults(html){ askOut.innerHTML = html; askOut.style.display = "block"; }
function askClose(){ askOut.style.display = "none"; }
function findNode(q){
  q = q.trim().toLowerCase().replace(/[?？.!]$/, "");
  if(!q) return null;
  let best = null, bestScore = 0;
  nodes.forEach(n => {
    if(n.layer) return;
    const hay = [n.name, n.short, ...(AKAS[n.id] || [])].map(s => String(s).toLowerCase());
    let score = 0;
    hay.forEach(h => {
      if(h === q) score = Math.max(score, 100);
      else if(h.includes(q) || q.includes(h)) score = Math.max(score, 50 + Math.min(h.length, q.length));
    });
    if(score > bestScore || (score === bestScore && best && n.power > best.power)){ best = n; bestScore = score; }
  });
  return bestScore >= 50 ? best : null;
}
function findSector(q){
  q = q.toLowerCase();
  for(const k of sectorKeys){
    const en = (SECTORS[k].name || "").toLowerCase(), zh = (I18N.zh.sectors[k] || "");
    if(en.includes(q) || q.includes(k) || (zh && q.includes(zh))) return k;
    for(const w of en.split(/[ ,&/]+/)) if(w.length > 3 && q.includes(w)) return k;
  }
  return null;
}
function askRow(n){
  return `<div class="r" data-go="${esc(n.id)}" role="option">${avatarHtml(n, "sm")}<span class="tx"><b>${esc(nm(n))}</b><span>${esc(subLine(n))}</span></span></div>`;
}
function runAsk(q){
  const T = t();
  q = q.trim();
  if(!q) return;
  S.askSet = null;
  const lower = q.toLowerCase();
  let m = lower.match(/(?:how (?:can|do) i (?:reach|meet|get to)|path to|introduc\w*(?: me)? to|reach|meet|到达|怎么(?:找到|联系|认识))\s*(.+)/);
  if(m){
    const target = findNode(m[1]);
    if(target){
      if(ME){
        const r = showRoutes(target);
        askResults(`<div class="explain">${r ? `${T.askExplainPath}: ${esc(T.you)} → ${esc(nm(target))}` : fmt(T.noRouteTitle, {name:esc(nm(target))})}</div><span class="act" data-clear="1">${T.clearAsk}</span>`);
        return;
      }
      const start = (S.selected && S.selected !== target) ? S.selected
                  : nodes.filter(n => n.kind === "person" && !n.layer && n !== target).sort((a, b) => b.power - a.power)[0];
      const r = routeBetween(start, target);
      if(r){
        PV = {routes:[r], idx:0, target, from:start};
        setRoute(r); renderPath(); openDetail("half");
        askResults(`<div class="explain">${T.askExplainPath}: ${esc(nm(start))} → ${esc(nm(target))}<br>${T.askNoMeHint}</div><span class="act" data-clear="1">${T.clearAsk}</span><span class="act" data-locate="1">${T.actAddSomeone}</span>`);
        return;
      }
      askResults(`<div class="explain">${T.pathNone}</div>`);
      return;
    }
  }
  m = lower.match(/who\b.*?\b(?:at|in)\s+(.+)|谁在\s*(.+)/);
  if(m){
    const inst = findNode(m[1] || m[2]);
    if(inst && inst.kind === "inst"){
      const people = inst.adj.filter(a => a.e.kind === "role" && !a.e.former).map(a => a.n);
      S.askSet = new Set([inst, ...people]);
      select(inst); centerOn(inst);
      askResults(`<div class="explain">${T.askExplainWho} ${esc(inst.short)} (${people.length})</div>`
        + people.sort((a, b) => b.power - a.power).slice(0, 10).map(askRow).join("")
        + `<span class="act" data-clear="1">${T.clearAsk}</span>`);
      return;
    }
  }
  const sk = findSector(lower);
  if(sk && /show|explore|related|sector|industry|network|关于|行业/.test(lower)){
    const g = GROUP_OF[sk];
    if(g !== undefined){ S.hl = new Set([g]); Legend.refreshHl(); computeVisible(); fitContext(); }
    askResults(`<div class="explain">${T.askExplainSector}: ${esc(sectorName(sk))}</div><span class="act" data-clear="1">${T.clearAsk}</span>`);
    return;
  }
  const hit = findNode(q);
  if(hit){ select(hit); centerOn(hit); askClose(); askIn.blur(); return; }
  askResults(`<div class="explain">${T.askNoMatch}</div>`);
}
function askShowExamples(){
  const T = t();
  const topInst = nodes.filter(n => n.kind === "inst" && !n.layer).sort((a, b) => b.power - a.power)[0];
  const pp = nodes.filter(n => n.kind === "person" && !n.layer).sort((a, b) => b.power - a.power);
  const exs = LANG === "zh"
    ? [topInst ? `谁在 ${topInst.short}` : null, pp[1] ? `怎么认识 ${pp[1].name}` : null, `${sectorName("energy")} 行业`]
    : [topInst ? `who at ${topInst.short}` : null, pp[1] ? `how can I meet ${pp[1].name}` : null, `show ${sectorName("energy")} industry`];
  askResults(`<div class="explain">${T.askTry}</div>` + exs.filter(Boolean).map(q => `<div class="r" data-ask="${esc(q)}"><span class="tx"><b>${esc(q)}</b></span></div>`).join(""));
}
askIn.addEventListener("focus", () => { if(!askIn.value.trim()) askShowExamples(); });
askIn.addEventListener("keydown", ev => {
  if(ev.key === "Enter"){ ev.preventDefault(); runAsk(askIn.value); }
  if(ev.key === "Escape"){ askClose(); askIn.blur(); }
});
askIn.addEventListener("input", () => {
  const q = askIn.value.trim().toLowerCase();
  if(!q.length){ askShowExamples(); return; }
  if(q.length < 2){ askClose(); return; }
  const hits = nodes.filter(n => !n.layer && (n.name.toLowerCase().includes(q) || (n.short && n.short.toLowerCase().includes(q)) ||
                    (AKAS[n.id] && AKAS[n.id].some(x => String(x).toLowerCase().includes(q)))))
       .sort((a, b) => b.power - a.power).slice(0, 8);
  if(!hits.length){ askResults(`<div class="explain">${t().askNoMatch}</div>`); return; }
  askResults(hits.map(askRow).join(""));
});
askOut.addEventListener("click", ev => {
  const go = ev.target.closest("[data-go]");
  if(go){ const n = byId[go.getAttribute("data-go")]; if(n){ S.askSet = null; select(n); centerOn(n); askClose(); askIn.blur(); } return; }

  if(ev.target.closest("[data-locate]")){ askClose(); openMyPanel({focus:"name"}); }

const chipRegistry = [];
function chip(parent, labelFn, on, cb){
  const el = document.createElement("button");
  el.type = "button";
  el.className = "chip" + (on ? " on" : " off");
  el.setAttribute("aria-pressed", on ? "true" : "false");
  const tn = document.createTextNode(labelFn());
  el.appendChild(tn);
  chipRegistry.push({tn, label:labelFn});
  el.onclick = () => {
    const now = el.classList.toggle("on");
    el.classList.toggle("off", !now);
    el.setAttribute("aria-pressed", now ? "true" : "false");
    cb(now);
    computeLiteSet(); computeVisible(); reheat(0.3); updateStats();
  };
  parent.appendChild(el);
  return el;
}
function buildFilters(){
  const fLayers = document.getElementById("f-layers");
  TIER_NAMES.forEach((_, i) => chip(fLayers, () => tierName(i), true, on => { on ? S.activeTiers.add(i) : S.activeTiers.delete(i); }));
  const fTypes = document.getElementById("f-types");
  chip(fTypes, () => t().cPeople, true, on => S.showPeople = on);
  chip(fTypes, () => t().cInsts, true, on => S.showInsts = on);
  chip(fTypes, () => t().cBoards, false, on => S.showAll = on);
  const fEdges = document.getElementById("f-edges");
  chip(fEdges, () => t().cRoles, true, on => S.showEdges.role = on);
  chip(fEdges, () => t().cOwn, true, on => S.showEdges.own = on);
  chip(fEdges, () => t().cFam, true, on => S.showEdges.family = on);
  chip(fEdges, () => t().cPot, true, on => S.showEdges.pot = on);
  chip(fEdges, () => t().cFormer, false, on => S.showEdges.former = on);
  const fSectors = document.getElementById("f-sectors");
  sectorKeys.forEach(k => {
    const el = chip(fSectors, () => sectorName(k), true, on => { on ? S.activeSectors.add(k) : S.activeSectors.delete(k); });
    const sw = document.createElement("span");
    sw.className = "sw"; sw.style.background = sectorColor(k);
    el.insertBefore(sw, el.firstChild);
  });
}

function updateStats(){
  const T = t();
  let vp = 0, vi = 0, ve = 0;
  VIS.forEach(n => { if(n.layer) return; if(n.kind === "person") vp++; else if(n.kind === "inst") vi++; });
  for(const e of edges) if(!e.layer && edgeVisible(e)) ve++;

      h += `<div class="ip-link ${ipCls(l)}${weak ? " weak" : ""}">`
         + `<div class="basis">${clsTag(ipCls(l))}${weak ? `<span class="ip-weak">${IT.weakest}</span>` : ""}</div>`
         + `<div class="ip-ev">${ipLinkText(l)}${l.dates && l.dates.length ? ` · ${esc(l.dates.join(", "))}` : ""}</div>`
         + (srcs.length ? `<div class="ip-src">${IT.records}: ${srcs.join(" · ")}</div>` : "")
         + (!l.first ? `<div class="ip-acts">` + (mine
              ? `<span class="plab">${mine.status === "confirmed" ? IT.know : IT.notLink} ✓</span><button type="button" class="ip-chip" data-act="ipLink" data-a="${esc(l.from)}" data-b="${esc(l.to)}" data-s="clear">${IT.undo}</button>`
              : `<button type="button" class="ip-chip" data-act="ipLink" data-a="${esc(l.from)}" data-b="${esc(l.to)}" data-s="confirmed">${svgI("check")} ${IT.know}</button>`
              + `<button type="button" class="ip-chip" data-act="ipLink" data-a="${esc(l.from)}" data-b="${esc(l.to)}" data-s="rejected">${IT.notLink}</button>`) + `</div>` : "")
         + `</div>`;
    }
  });
  h += `</div>`;
  const a = byId[p.people[1].id], b = byId[p.people[2].id];
  h += `<div class="sect">${IT.nextTitle}</div><p class="plab">${fmt(p.intermediaries <= 1 ? IT.nextAskT : IT.nextAsk, {a:esc(a.name), b:esc(b.name)})}</p>`
     + `<div class="sect">${IT.draftTitle}</div><textarea class="mp-input ip-draft" id="ip-draft" rows="7">${esc(ipDraft(p, tg))}</textarea>`
     + `<div class="actrow"><button class="btn sm" type="button" data-act="ipCopy">${IT.copy}</button></div><p class="plab">${IT.draftNote}</p>`;
  h += `<p class="disclaim">${IT.disclaim} ${IT.privNote}</p>`;
  h += `<div class="actrow"><button class="btn" data-act="openTarget">${T.openProfile}</button><button class="btn ghost" data-act="clearPath">${T.clearPath}</button></div>`;
  dbody.innerHTML = h;
  dbody.scrollTop = 0;
  Sheets.setPeek(detailEl, dbody.querySelector(".rt-start") || dbody.querySelector(".pf-head"));
}
function ipAction(act, el){
  const IT = ipT();
  if(act === "ipPick"){ const n = byId[el.getAttribute("data-id")]; if(n) showRoutes(n); return; }
  if(act === "ipCopy"){
    const ta = document.getElementById("ip-draft");
    if(ta){ (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(() => { el.textContent = IT.copied; }, () => { ta.select(); }); }
    return;
  }
  if(!PV || !PV.target) return;
  const ev = ipEv();
  if(act === "ipLink"){
    const k = IntroPaths.pairKey(el.getAttribute("data-a"), el.getAttribute("data-b")), s = el.getAttribute("data-s");
    if(s === "clear") delete ev.links[k]; else ev.links[k] = {status:s, at:Date.now()};
  } else if(act === "ipWill"){
    const id = el.getAttribute("data-id"), w = el.getAttribute("data-w");
    ev.willing = ev.willing || {};
    if(w === "unknown") delete ev.willing[id]; else ev.willing[id] = w;
  }
  ipEvSave(ev);
  const tg = PV.target;
  if(!introShow(tg, {noFit:true})) { /* the panel now explains why no route remains */ }
  toast(IT.saved);
}
/* profile callout: the best person-to-person route, or why there is none */
function ipAccessCallout(n){
  const IT = ipT(), T = t();
  if(n.kind === "inst") return `<div class="callout"><b>${T.accTitle}</b><div style="margin-top:4px">${IT.accOrg}</div>`
                             + `<div class="row"><button class="btn sm primary" data-act="path">${svgI("route")} ${IT.accPick}</button></div></div>`;
  const res = IntroPaths.find(ipIndex(), {target:n.id, starts:ipStarts(), evidence:ipEv(), k:1, maxLinks:4});
  if(res.status !== "ok") return `<div class="callout"><b>${T.accTitle}</b><div style="margin-top:4px">${fmt(IT.noneTitle, {name:esc(n.name)})}</div>`
                               + `<div class="row"><button class="btn sm" data-act="path">${svgI("route")} ${T.showRoute}</button></div></div>`;
  const p = res.paths[0];
  const chain = p.people.map((x, i) => (i ? "<i> → </i>" : "") + esc(x.id === "__me" ? T.you : x.name)).join("");
  return `<div class="callout access"><b><span class="ip-lab ${p.label}">${IT[p.label]}</span></b><div class="chain">${chain}</div>`
       + `<div class="row"><button class="btn sm primary" data-act="path">${svgI("route")} ${T.showRoute}</button></div></div>`;
}

/* ================================================================
   ALUMNI CIRCLE LAYER — invitation-only, enforced by the server.
   Off unless /api/me says this account has access AND turned it on.
   Records come from /api/circle (public bios, members' own profiles,
   fictional demo); nothing is copied into your contacts.
   ================================================================ */
var ALUM = null;
const AL_COUNTRY = {abudhabi:"United Arab Emirates", dubai:"United Arab Emirates", northern:"United Arab Emirates", saudi:"Saudi Arabia",
                    qatar:"Qatar", bahrain:"Bahrain", oman:"Oman", kuwait:"Kuwait"};
const alNorm = s => String(s || "").toLowerCase().replace(/\([^)]*\)/g, "").replace(/[^a-z0-9]+/g, " ").trim();
function alumApply(){
  if(!ALUM) return;
  nodes.forEach(n => { if(!n.layer) n.alum = null; });
  ALUM.ctx = null; ALUM.here = []; ALUM.away = [];
  if(!ALUM.on) return;
  const F = ALUM.filters || {}, region = Personal.REGION, school = byId.insead;
  const recs = ALUM.recs.filter(r => ["country", "city", "industry", "org"].every(k => !F[k] || r[k] === F[k])
                                    && (!F.cohort || (r.cohort || r.program) === F.cohort));
  const inst = {};
  nodes.forEach(n => { if(n.kind === "inst" && !n.layer){ inst[alNorm(n.name)] = n; inst[alNorm(n.short)] = n; } });
  const ctx = new Set();
  const addCtx = n => { ctx.add(n); n.adj.forEach(a => { if(a.n.kind === "inst" && !a.e.former) ctx.add(a.n); }); };
  let k = 0;
  recs.forEach(r => {
    if(r.source === "public"){
      if(r.region === region && byId[r.nodeId]){ const n = byId[r.nodeId]; n.alum = r; ALUM.here.push({r, n}); addCtx(n); }
      else ALUM.away.push(r);
      return;
    }
    const org = inst[alNorm(r.org)];
    const anchor = org || (r.country === AL_COUNTRY[region] ? school : null);
    if(!anchor || ALUM.hidden){ if(!anchor) ALUM.away.push(r); else ALUM.here.push({r, n:null}); return; }
    const ang = (k++) * 2.39996, rad = 64 + (k % 3) * 16;
    const n = layerNode({id:"__al_" + r.id, kind:"person", name:r.name, short:r.name, sector:anchor.sector, tier:3, power:50,
      roles:org ? [[org.id, r.title || "", "executive", "ns"]] : [], demo:!!r.fictional,
      note:r.fictional ? ipT().alDemoNote : ipT().alMemberNote,
      x:anchor.x + Math.cos(ang) * rad, y:anchor.y + Math.sin(ang) * rad, radius:5.2});
    n.alum = r;
    if(org) layerEdge({s:n, t:org, kind:"role", label:r.title || "", v:"ns", former:false, alum:true, demo:!!r.fictional});
    if(school && school !== org) layerEdge({s:n, t:school, kind:"alumni", label:r.program || "", v:"ns", former:false, alum:true});
    ALUM.here.push({r, n}); addCtx(n);
  });
  if(ALUM.hidden) nodes.forEach(n => { if(!n.layer) n.alum = null; });
  else ALUM.ctx = ctx;
}
function alumOnlyHides(n){
  return !!(ALUM && ALUM.on && !ALUM.hidden && ALUM.mode === "only" && ALUM.ctx && !n.layer && !ALUM.ctx.has(n) && !n.myDirect);
}
async function alumApi(p, method, body){
  let tk = null; try { tk = localStorage.getItem("pm2_token"); } catch(e){}
  if(!tk) return null;
  const r = await fetch("/api/" + p, {method:method || "GET", headers:{"Content-Type":"application/json", Authorization:"Bearer " + tk},
                                       body:body ? JSON.stringify(body) : undefined});
  return r.ok ? r.json() : null;
}
async function alumLoad(){
  if(!Acct.on()){ ALUM = null; return; }
  const me = await alumApi("me").catch(() => null);
  if(!me){ ALUM = null; return; }
  const L = me.layers && me.layers.alumni, circles = me.circles || [];
  if(!L || !L.on || !circles.includes(L.circle)){ ALUM = {on:false, can:circles.length > 0}; if(myPanel.classList.contains("open")) renderMyPanel(true); return; }
  const c = await alumApi("circle/" + L.circle).catch(() => null);
  if(!c){ ALUM = {on:false, can:false}; return; }
  ALUM = {on:true, can:true, mode:L.mode, filters:L.filters || {}, circle:L.circle, name:c.name, recs:c.records, counts:c.counts,
          hidden:(() => { try { return sessionStorage.getItem("nv_al_hide") === "1"; } catch(e){ return false; } })()};
  rebuildPersonal(false);
  if(myPanel.classList.contains("open")) renderMyPanel(true);
}
function alumHtml(){
  const IT = ipT();
  let h = `<div class="sect">${IT.alTitle}</div>`;
  if(!ALUM || !ALUM.on){
    const why = !Acct.on() ? IT.alNeedSign : ALUM && ALUM.can ? IT.alOff : IT.alInv;
    return h + `<div class="mp-card al-card"><div style="flex:1">${why}</div><a class="btn sm primary" href="/premium.html">${IT.alTry} ${svgI("chevR")}</a></div>`;
  }
  const c = ALUM.counts, F = ALUM.filters || {};
  const fl = Object.keys(F).filter(k => F[k]).map(k => `${k}: ${esc(F[k])}`).join(" · ") || IT.alNoFilters;
  const regName = rg => ({abudhabi:"Abu Dhabi", dubai:"Dubai", northern:"Northern Emirates", saudi:"Saudi Arabia", qatar:"Qatar", bahrain:"Bahrain", oman:"Oman", kuwait:"Kuwait"})[rg] || rg;
  h += `<div class="mp-nums"><div><b>${ALUM.here.length}</b><span>${IT.alOnMap}</span></div><div><b>${ALUM.away.length}</b><span>${IT.alElse}</span></div>`
     + `<div><b>${c.unique}</b><span>${IT.alUnique}</span></div></div>`
     + `<p class="plab">${esc(ALUM.name)} · ${fmt(IT.alSrc, {p:c.public, m:c.members, d:c.demo})}</p>`
     + `<div class="seg">` + [["overlay", IT.alOverlay], ["only", IT.alOnly]].map(([m, l]) =>
         `<button type="button" data-al="mode" data-m="${m}" class="${ALUM.mode === m ? "on" : ""}" aria-pressed="${ALUM.mode === m}">${l}</button>`).join("") + `</div>`
     + `<p class="plab">${IT.alFilters}: ${fl} · <a href="/premium.html">${IT.alEdit}</a></p>`
     + `<input class="mp-input" id="al-q" type="search" placeholder="${IT.alSearch}" autocomplete="off">`
     + `<div class="al-list" id="al-list">`
     + ALUM.here.map(({r, n}) => alRow(r, n, null)).join("")
     + ALUM.away.map(r => alRow(r, null, r.region)).join("")
     + `</div>`
     + `<p class="plab">${IT.alCov}</p>`
     + `<div class="actrow"><button class="btn sm" type="button" data-al="hide">${ALUM.hidden ? IT.alShow : IT.alHide}</button>`
     + `<button class="btn sm danger" type="button" data-al="off">${IT.alRemove}</button></div>`;
  return h;
  function alRow(r, n, away){
    const tag = r.source === "demo" ? `<span class="cls demo">${IT.demo}</span>` : r.source === "public" ? `<span class="cls confirmed">${IT.pub}</span>` : `<span class="cls potential">${IT.mem}</span>`;
    const sub = [r.title, r.org].filter(Boolean).join(" · "), sub2 = [r.program, r.cohort, r.city || r.country].filter(Boolean).join(" · ");
    const go = n ? ` data-go-p="${esc(n.id)}"` : "";
    const where = away ? ` · <a href="/${esc(away)}/">${esc(regName(away))} ${IT.openMap}</a>` : "";
    return `<div class="al-row"${go} data-q="${esc((r.name + " " + sub + " " + sub2).toLowerCase())}"><div><b>${esc(r.name)}</b><span>${esc(sub)}</span><span>${esc(sub2)}${where}</span></div>${tag}</div>`;
  }
}
function wireAlum(){
  const q = document.getElementById("al-q");
  if(q) q.oninput = () => { const v = q.value.trim().toLowerCase(); document.querySelectorAll("#al-list .al-row").forEach(el => { el.style.display = !v || el.dataset.q.includes(v) ? "" : "none"; }); };
}
async function alumAction(act, el){
  if(!ALUM || !ALUM.on) return;
  if(act === "mode"){
    ALUM.mode = el.getAttribute("data-m");
    alumApi("layers", "PUT", {alumni:{on:true, circle:ALUM.circle, mode:ALUM.mode, filters:ALUM.filters}});
  } else if(act === "hide"){
    ALUM.hidden = !ALUM.hidden;
    try { sessionStorage.setItem("nv_al_hide", ALUM.hidden ? "1" : "0"); } catch(e){}
  } else if(act === "off"){
    const r = await alumApi("layers", "PUT", {alumni:{on:false, circle:ALUM.circle}});
    if(r){ ALUM = {on:false, can:true}; toast(ipT().alRemoved); }
  }
  rebuildPersonal(false);
  renderMyPanel(true);
}
