<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0A1120"/>
<meta name="color-scheme" content="dark"/>
<title>Northern Emirates Power Network — NavGCC</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
  /* =============================================================
     NavGCC design system — "the park map"
     Deep navy ground, vibrant industry colours, one luminous accent
     for you / focus / routes. Every colour is paired with a label or
     icon; text always wears ink tokens, never an industry colour.
     ============================================================= */
  :root{
    --bg:#0A1120; --bg-raise:#0E1627; --surface:#121B2E; --surface-2:#18243A; --surface-3:#1F2D47;
    --glass:rgba(14,22,39,.97);
    --line:rgba(148,163,184,.14); --line-2:rgba(148,163,184,.26);
    --ink:#EEF2F8; --ink-dim:#B1BCCD; --ink-faint:#8190A7;
    --accent:#7C8CFF; --accent-hi:#A3AEFF; --accent-soft:rgba(124,140,255,.15); --accent-br:rgba(124,140,255,.55);
    --ok:#3DD68C; --ok-ink:#A7EFCB; --warn:#F2B544; --warn-ink:#F8D58C; --bad:#FF7A7A; --bad-ink:#FFC1C1;
    --shadow:0 14px 34px rgba(2,6,16,.55);
    --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    --display:"Sora","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);overflow:hidden;
       -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,textarea{font:inherit;color:inherit}
  a{color:var(--accent-hi)}
  [hidden]{display:none !important}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgba(148,163,184,.22);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}

  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #stage.dragging{cursor:grabbing}

  /* ---------- loading ---------- */
  #boot{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:12px;text-align:center;padding:24px;transition:opacity .35s ease}
  #boot.gone{opacity:0;pointer-events:none}
  #boot img{width:46px;height:46px;border-radius:12px}
  #boot .bt{font-family:var(--display);font-weight:600;font-size:16px}
  #boot .bs{font-size:13px;color:var(--ink-faint);max-width:320px}
  #boot .bar{width:170px;height:3px;border-radius:2px;background:var(--surface-2);overflow:hidden;position:relative;margin-top:4px}
  #boot .bar i{position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,var(--accent),transparent);
               animation:bootbar 1.2s ease-in-out infinite}
  @keyframes bootbar{from{transform:translateX(-110%)}to{transform:translateX(270%)}}
  #boot.err .bar{display:none}
  #boot.err .bs{color:var(--bad-ink)}

  /* ---------- top bar ---------- */
  #topbar{position:fixed;z-index:30;top:calc(10px + var(--sat));left:calc(12px + var(--sal));right:calc(12px + var(--sar));
          height:54px;display:flex;align-items:center;gap:10px;padding:0 8px 0 10px;background:var(--glass);
          border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);transition:transform .25s ease,opacity .25s ease}
  #brandwrap{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);flex:none;border-radius:10px;padding:4px}
  #brandlogo{width:28px;height:28px;border-radius:8px;display:block}
  #wordmark{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.005em}
  #regions{position:relative;flex:none}
  #regions summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:11px;
                   border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap;
                   user-select:none;max-width:190px;overflow:hidden;text-overflow:ellipsis}
  #regions summary::-webkit-details-marker{display:none}
  #regions summary::after{content:"";width:6px;height:6px;border-right:1.6px solid var(--ink-faint);border-bottom:1.6px solid var(--ink-faint);
                          transform:rotate(45deg) translateY(-2px);flex:none}
  #regions summary:hover{border-color:var(--line-2);background:var(--surface-2)}
  #regions nav{position:absolute;top:46px;left:0;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;
               box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;min-width:200px;z-index:60}
  #regions nav a{padding:10px 12px;border-radius:9px;font-size:13.5px;color:var(--ink-dim);text-decoration:none;white-space:nowrap}
  #regions nav a:hover{background:var(--surface-2);color:var(--ink)}
  #regions nav a.on{color:var(--ink);background:var(--accent-soft);font-weight:600}

  #askwrap{position:relative;flex:1 1 360px;min-width:150px;max-width:470px;display:flex;align-items:center}
  #askwrap > svg.i{position:absolute;left:12px;color:var(--ink-faint);pointer-events:none}
  #ask{width:100%;height:38px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:0 12px 0 36px;
       font-size:13.5px;outline:none;color:var(--ink)}
  #ask::placeholder{color:var(--ink-faint)}
  #ask:focus{border-color:var(--accent-br);background:var(--surface-2)}
  #askout{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;
          box-shadow:var(--shadow);padding:6px;display:none;max-height:min(60vh,440px);overflow:auto;z-index:50}
  #askout .explain{font-size:12px;color:var(--ink-dim);padding:8px 10px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
  #askout .r{padding:7px 10px;border-radius:10px;cursor:pointer;font-size:13.5px;display:flex;gap:10px;align-items:center;min-height:44px}
  #askout .r:hover{background:var(--surface-2)}
  #askout .r .tx{flex:1;min-width:0}
  #askout .r .tx b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #askout .r .tx span{display:block;font-size:12px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #askout .act{display:inline-flex;margin:6px 4px 2px 8px;padding:7px 12px;border:1px solid var(--line-2);border-radius:999px;
               font-size:12.5px;color:var(--accent-hi);cursor:pointer}
  #askout .act:hover{background:var(--accent-soft)}

  #views{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;flex:none}
  .vpill{height:32px;padding:0 12px;border-radius:9px;font-size:12.5px;color:var(--ink-dim);display:flex;align-items:center;white-space:nowrap}
  .vpill:hover{color:var(--ink)}
  .vpill.on{background:var(--accent-soft);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent-br)}

  #topright{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 13px;border-radius:11px;
       border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;white-space:nowrap;
       cursor:pointer;user-select:none;text-decoration:none;transition:background .15s,border-color .15s,color .15s}
  .btn:hover{background:var(--surface-2);border-color:var(--line-2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#0A1120;font-weight:600}
  .btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-dim)}
  .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
  .btn.icon{width:38px;padding:0}
  .btn.on{border-color:var(--accent-br);background:var(--accent-soft)}
  .btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px}
  .btn.block{width:100%}
  .btn.warn{color:var(--warn-ink);border-color:rgba(242,181,68,.4)}
  .btn.danger{color:var(--bad-ink);border-color:rgba(255,122,122,.35)}
  .btn[disabled]{opacity:.45;pointer-events:none}
  label.btn{position:relative;overflow:hidden}
  .youdot{width:9px;height:9px;border-radius:50%;background:var(--ink-faint);box-shadow:0 0 0 3px rgba(129,144,167,.18);flex:none}
  .youdot.on{background:var(--accent);box-shadow:0 0 0 3px rgba(124,140,255,.25)}
  .youdot.demo{background:var(--warn);box-shadow:0 0 0 3px rgba(242,181,68,.25)}
  #b-more{display:none}
  #b-mynet .mn-ic{display:none}
  .linkbtn{font-size:12.5px;color:var(--accent-hi);padding:5px 7px;border-radius:7px;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
  .linkbtn:hover{background:var(--accent-soft)}

  /* ---------- demo banner ---------- */
  #demobar{position:fixed;z-index:29;top:calc(74px + var(--sat));left:50%;transform:translateX(-50%);display:flex;align-items:center;
           gap:10px;padding:5px 6px 5px 14px;border-radius:999px;background:rgba(40,30,8,.92);border:1px solid rgba(242,181,68,.5);
           color:var(--warn-ink);font-size:12.5px;white-space:nowrap;box-shadow:var(--shadow)}
  #demobar b{font-weight:700;letter-spacing:.08em;font-size:10.5px;color:var(--warn)}
  #demobar button{height:30px;padding:0 12px;border-radius:999px;background:rgba(242,181,68,.16);color:#FBE3AE;font-size:12.5px;font-weight:600}
  #demobar button:hover{background:rgba(242,181,68,.28)}
  /* demo ENTRY POINTS hidden by owner decision 2026-10-18 — machinery kept, ?demo=1 still honored */
  [data-act="demo"],[data-in="demo"],[data-t="demo"],[data-q="demo"]{display:none!important}

  /* ---------- industry legend (desktop: floating sidebar · phone: sheet) ---------- */
  #legend{position:fixed;z-index:20;top:calc(76px + var(--sat));left:calc(12px + var(--sal));width:252px;
          max-height:calc(100dvh - 150px - var(--sat));display:flex;flex-direction:column;background:var(--glass);
          border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  #legend .grab{display:none}
  .lg-hd{display:flex;align-items:center;gap:4px;padding:10px 8px 6px 14px;flex:none}
  .lg-hd b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-right:auto}
  .lg-body{overflow-y:auto;padding:0 8px 12px;overscroll-behavior:contain}
  #legend.collapsed .lg-body{display:none}
  #legend.collapsed .lg-tg svg{transform:rotate(-90deg)}
  .lg-hint{font-size:11.5px;color:var(--ink-faint);padding:6px 6px 2px}
  .inds{display:flex;flex-direction:column;gap:2px}
  .ind{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:5px 6px;border-radius:11px;text-align:left;
       font-size:13px;color:var(--ink);border:1px solid transparent;transition:background .15s,opacity .15s,border-color .15s}
  .ind:hover{background:var(--surface-2)}
  .ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--c2);
      color:var(--c);flex:none;box-shadow:inset 0 0 0 1px var(--c3)}
  .ic svg{width:15px;height:15px}
  .ind .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ind .ct{font-size:11.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .ind.on{background:var(--c4);border-color:var(--c3)}
  .ind.on .nm{font-weight:600}
  .has-on .ind:not(.on){opacity:.5}
  .has-on .ind:not(.on):hover{opacity:1}
  .lg-sub{display:flex;align-items:center;gap:6px;margin:14px 6px 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
          color:var(--ink-faint);font-weight:600}
  .key{display:flex;align-items:center;gap:10px;padding:4px 6px;font-size:12.5px;color:var(--ink-dim);min-height:26px}
  .key svg{flex:none;overflow:visible}
  .sig{display:block;width:100%;text-align:left;padding:7px 6px;border-radius:9px;font-size:12px;color:var(--ink-dim);line-height:1.35}
  .sig:hover{background:var(--surface-2);color:var(--ink)}
  .sig small{display:block;color:var(--ink-faint);font-size:11px;margin-top:2px}

  /* ---------- phone industry strip ---------- */
  #chipstrip{display:none}

  /* ---------- map controls ---------- */
  #mapctl{position:fixed;z-index:19;right:calc(14px + var(--sar));bottom:calc(16px + var(--sab));display:flex;flex-direction:column;gap:6px;
          transition:bottom .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
  #mapctl button{width:40px;height:40px;border-radius:12px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);
                 display:flex;align-items:center;justify-content:center;color:var(--ink-dim)}
  #mapctl button:hover{color:var(--ink);background:var(--surface-2)}
  #mapctl button.on{color:var(--ink);border-color:var(--accent-br);background:var(--accent-soft)}
  #mapctl .mob{display:none}
  body.rp-open #mapctl{right:calc(400px + var(--sar))}

  /* ---------- panels (desktop floating · phone bottom sheets) ---------- */
  .panel{position:fixed;z-index:24;background:var(--surface);border:1px solid var(--line-2);border-radius:18px;box-shadow:var(--shadow);
         display:flex;flex-direction:column;overflow:hidden}
  .grab{display:none}
  .panel .close{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:10px;color:var(--ink-faint);display:flex;
                align-items:center;justify-content:center;z-index:3}
  .panel .close:hover{background:var(--surface-2);color:var(--ink)}
  .pbody{position:relative;overflow-y:auto;padding:18px 18px 22px;overscroll-behavior:contain;flex:1;min-height:0}
  #detail{top:calc(76px + var(--sat));right:calc(12px + var(--sar));bottom:calc(16px + var(--sab));width:376px;
          transform:translateX(calc(100% + 30px));visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s linear .26s}
  #detail.open{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s}
  #mypanel{top:calc(76px + var(--sat));right:calc(12px + var(--sar));width:424px;max-height:calc(100dvh - 94px - var(--sat));display:none;z-index:26}
  #mypanel.open{display:flex}
  #filters{top:calc(76px + var(--sat));right:calc(12px + var(--sar));width:316px;max-height:calc(100dvh - 150px);display:none;z-index:25}
  #filters.open{display:flex}

  /* profile */
  .eyebrow{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:6px}
  .pf-head{display:flex;gap:12px;align-items:flex-start;margin-right:38px}
  .pf-tt{min-width:0}
  .avatar{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;
          font-size:15px;color:var(--ink);background:var(--c2);box-shadow:inset 0 0 0 1.5px var(--c)}
  .avatar svg{width:20px;height:20px;color:var(--c)}
  .avatar.org{border-radius:13px}
  .avatar.me{background:var(--accent);box-shadow:0 0 0 3px #fff inset}
  .avatar.me svg{color:#0A1120}
  .pf-head h2{font-family:var(--display);font-size:18.5px;line-height:1.25;font-weight:600;letter-spacing:-.005em;word-break:break-word}
  .pf-role{font-size:13px;color:var(--ink-dim);margin-top:3px}
  .pf-meta{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 2px}
  .tag{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:2px 10px;border-radius:999px;font-size:12px;color:var(--ink-dim);
       background:var(--surface-2);border:1px solid var(--line)}
  .tag svg{width:13px;height:13px}
  .tag.ind-t{color:var(--ink);background:var(--c4);border-color:var(--c3)}
  .tag.ind-t svg{color:var(--c)}
  .tag.demo{color:var(--warn-ink);background:rgba(242,181,68,.12);border:1px dashed rgba(242,181,68,.6);font-weight:700;letter-spacing:.08em;font-size:10.5px}
  .tag.ok{color:var(--ok-ink);border-color:rgba(61,214,140,.4);background:rgba(61,214,140,.1)}
  .pf-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
  .pf-actions .btn{height:42px;white-space:normal;line-height:1.2;text-align:center}
  .pf-actions .btn.primary{grid-column:1/-1}
  .pf-links{display:flex;flex-wrap:wrap;gap:2px 6px;margin:2px -6px 0}
  .sect{font-size:11px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase;margin:20px 0 8px;font-weight:600}
  .powerbar{height:4px;background:var(--surface-3);border-radius:2px;margin:14px 0 5px;overflow:hidden}
  .powerbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hi));border-radius:2px}
  .plab{font-size:12px;color:var(--ink-faint)}
  .plab a{color:var(--ink-dim)}
  .role{padding:10px 12px;border-radius:12px;background:var(--bg-raise);border:1px solid var(--line);margin-bottom:6px;font-size:13px}
  .role .rt{color:var(--ink)}
  .role .ri{color:var(--accent-hi);cursor:pointer}
  .role .ri:hover{text-decoration:underline}
  .role .ns{color:var(--warn-ink);font-size:10.5px;margin-left:6px;border:1px solid rgba(242,181,68,.4);padding:1px 7px;border-radius:9px;white-space:nowrap}
  .role .meta{color:var(--ink-faint);font-size:11.5px}
  .badge{display:inline-block;padding:1px 8px;border-radius:9px;font-size:10.5px;margin-left:6px;border:1px solid var(--line-2);color:var(--ink-faint)}
  .conn{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer;font-size:13px;min-height:42px}
  .conn:hover{background:var(--surface-2)}
  .conn .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,#9AA7BB)}
  .conn .kind{margin-left:auto;color:var(--ink-faint);font-size:11.5px;text-align:right;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .note{font-size:12.5px;color:var(--ink-dim);background:var(--bg-raise);padding:10px 12px;border-radius:12px;border-left:2px solid var(--accent-br);margin-top:10px}
  .callout{padding:13px 14px;border-radius:14px;background:var(--bg-raise);border:1px solid var(--line);font-size:13px;color:var(--ink-dim);margin-top:12px}
  .callout b{color:var(--ink);font-weight:600}
  .callout .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .callout.access{border-color:var(--accent-br);background:linear-gradient(180deg,rgba(124,140,255,.12),rgba(124,140,255,.02))}
  .callout .chain{font-size:12.5px;color:var(--ink);margin-top:6px;line-height:1.5}
  .callout .chain i{font-style:normal;color:var(--ink-faint)}

  /* route / path mode */
  .rt-alts{display:flex;gap:6px;overflow-x:auto;margin:12px 0 2px;padding-bottom:4px;scrollbar-width:thin}
  .rt-alt{flex:none;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);font-size:12.5px;color:var(--ink-dim);white-space:nowrap}
  .rt-alt:hover{background:var(--surface-2)}
  .rt-alt.on{background:var(--accent-soft);border-color:var(--accent-br);color:var(--ink);font-weight:600}
  .rt-sum{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
  .steps{margin:10px 0 4px}
  .step{display:grid;grid-template-columns:26px 1fr;gap:8px;cursor:pointer}
  .step .rail{position:relative;display:flex;justify-content:center}
  .step .pin{width:13px;height:13px;border-radius:50%;margin-top:14px;background:var(--surface);box-shadow:0 0 0 2.5px var(--c,#9AA7BB);z-index:1}
  .step.me .pin{background:var(--accent);box-shadow:0 0 0 3px #fff}
  .step .rail::after{content:"";position:absolute;top:30px;bottom:-14px;width:2px;background:rgba(255,255,255,.7)}
  .step.last .rail::after{display:none}

/* ---------- industries ----------
   The site's 15 sector keys fold into 10 industry groups (the existing
   grouping, not new categories). Hues are the dataviz reference palette's
   dark steps, validated against #0E1627 (lightness band, chroma, adjacent
   CVD ΔE ≥ 8.4, normal-vision ΔE ≥ 19.3, ≥ 3:1 contrast) + two neutrals.
   A network puts any two colours side by side, so identity is never
   colour-alone: every legend row, chip, tag and district label carries an
   icon and a name. */
const SECTOR_GROUPS = [
  {color:"#3987e5", icon:"bank",     en:"Financials",              zh:"金融",         sectors:["finance"]},
  {color:"#d95926", icon:"bolt",     en:"Energy & Utilities",      zh:"能源与公用事业", sectors:["energy","utilities"]},
  {color:"#199e70", icon:"care",     en:"Health & Education",      zh:"医疗与教育",    sectors:["health","education"]},
  {color:"#c98500", icon:"coins",    en:"Sovereign Capital",       zh:"主权资本",      sectors:["sovereign"]},
  {color:"#d55181", icon:"bag",      en:"Consumer",                zh:"消费",         sectors:["consumer_disc","consumer_stap"]},
  {color:"#008300", icon:"building", en:"Real Estate",             zh:"房地产",       sectors:["realestate"]},
  {color:"#9085e9", icon:"chip",     en:"Technology & Telecom",    zh:"科技与通信",    sectors:["tech","comm"]},
  {color:"#e66767", icon:"factory",  en:"Industrials & Materials", zh:"工业与原材料",   sectors:["industry","materials"]},
  {color:"#9DA9BB", icon:"flag",     en:"Government & Political",  zh:"政府与政治",    sectors:["gov"]},
  {color:"#B8A487", icon:"users",    en:"Family Conglomerates",    zh:"家族企业集团",   sectors:["conglomerate"]},
];
const GROUP_OF = {};
SECTOR_GROUPS.forEach((g, i) => g.sectors.forEach(s => GROUP_OF[s] = i));
function groupOf(n){ const g = GROUP_OF[n.sector]; return g === undefined ? -1 : g; }
function sectorColor(k){
  const g = GROUP_OF[k];
  return g !== undefined ? SECTOR_GROUPS[g].color : ((SECTORS[k] && SECTORS[k].color) || C.base);
}
function nodeColor(n){ return n.kind === "me" ? C.accent : sectorColor(n.sector); }
function indIcon(n){ const g = groupOf(n); return g >= 0 ? SECTOR_GROUPS[g].icon : "info"; }
function hexA(hex, a){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function indVars(color){ return `--c:${color};--c2:${hexA(color,.2)};--c3:${hexA(color,.55)};--c4:${hexA(color,.14)}`; }
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmt(s, o){ return String(s).replace(/\{(\w+)\}/g, (m, k) => (o && o[k] !== undefined) ? o[k] : m); }
function isMob(){ return W > 10 && W < 761; }

function t(){ return I18N[LANG]; }
function tierName(i){ return t().tiers[i] || ""; }
function sectorName(k){ const s = t().sectors; return (s && s[k]) || (SECTORS[k] ? SECTORS[k].name : (k === "__me" ? "" : k)); }
function roleTypeName(rt){ return t().roleTypes[rt] || rt; }
function groupName(i){ const g = SECTOR_GROUPS[i]; return g ? (LANG === "zh" ? g.zh : g.en) : t().other; }

/* ---------- build nodes & edges ---------- */
const nodes = [], byId = {};
INSTITUTIONS.forEach(i => {
  const nd = {id:i.id, kind:"inst", name:i.n, short:i.short || i.n, sector:i.s, tier:i.t, power:i.p};
  nodes.push(nd); byId[i.id] = nd;
});
PEOPLE.forEach(p => {
  const nd = {id:p.id, kind:"person", name:p.n,
              short:p.n.replace(/^H\.H\. |^H\.E\. |^Dr\. |^Prof\. |^Capt\. |^Eng\. |^Sheikh /,"").replace(" Al Nahyan",""),
              sector:p.s, tier:p.t, power:p.p, roles:p.roles || [], note:p.note};
  nodes.push(nd); byId[p.id] = nd;
});
nodes.forEach(n => { n.deg = 0; n.adj = []; n.news = []; n.contacts = []; n.myDirect = false; n.myConf = null; });
const edges = [];
function linkEdge(e){
  edges.push(e);
  e.s.adj.push({n:e.t, e}); e.t.adj.push({n:e.s, e});
  if(e.kind !== "pot" && e.kind !== "alumni" && !e.former && !e.layer){ e.s.deg++; e.t.deg++; }   // history and your own layer are not public reach
  return e;
}
function addEdge(a, b, kind, label, v, former){
  if(!byId[a] || !byId[b]){ console.warn("edge refers to missing node:", a, b); return null; }
  return linkEdge({s:byId[a], t:byId[b], kind, label:label || "", v:v || "v", former:!!former});
}
/* "alumni" roles (education ties) are their own weak edge kind: drawn and listed,
   but never counted as reach and never used as an introduction path */
PEOPLE.forEach(p => (p.roles || []).forEach(r => addEdge(p.id, r[0], r[2] === "alumni" ? "alumni" : "role", r[1], r[3], r[4])));
(typeof OWNERSHIP !== "undefined" ? OWNERSHIP : []).forEach(o => addEdge(o[0], o[1], "own", o[2] || "owned / controlled by", o[3]));
(typeof FAMILY !== "undefined" ? FAMILY : []).forEach(f => addEdge(f[0], f[1], "family", f[2]));
const AKAS = (typeof AKA !== "undefined") ? AKA : {};
const sectorKeys = Object.keys(SECTORS);

/* headline role: a chair / CEO / minister seat outranks "member", then the bigger organization */
const TOP_TITLE = /\b(ruler|crown prince|president|prime minister|minister|governor|chair(man|woman|person)?|chief executive|ceo|managing director|secretary[- ]general|director[- ]general|founder)\b/i;
function titleRank(t){ return TOP_TITLE.test(t) && !/\b(vice|deputy|assistant|former)\b/i.test(t) ? 2 : /\b(vice|deputy)\b/i.test(t) ? 1 : 0; }
function currentRole(p){
  const rs = (p.roles || []).filter(r => !r[4] && byId[r[0]]);
  if(!rs.length) return null;
  return rs.slice().sort((a, b) => (titleRank(b[1]) - titleRank(a[1])) || (byId[b[0]].power - byId[a[0]].power))[0];
}
function homeInst(p){ const r = currentRole(p); return r ? byId[r[0]] : null; }

/* LinkedIn people-search query: add the current company so common names resolve. */
function liQuery(n){
  if(n.kind === "inst") return n.name.replace(/\s*\(.*\)/, "");
  let q = n.name.replace(/^((?:H\.H\.|H\.E\.|Sheikh|Sheikha|Shaikh|Dr\.|Prof\.|Capt\.|Captain|Eng\.|Lt\. Gen\.)\s+)+/, "");
  const cur = (n.roles || []).find(r => !r[4]);
  if(cur){ const inst = byId[cur[0]]; if(inst) q += " " + (inst.short || inst.name).replace(/\s*\(.*\)/, ""); }
  return q;
}

  NEWS.forEach(it => (it.ids || []).forEach(id => { (by[id] = by[id] || []).push(it); }));

  (window.SUGGESTED_EDGES || []).forEach(s => addEdge(s.a, s.b, "pot", `co-mentioned in ${s.n} articles`, "pot"));
  Legend.renderSignals();

}
function lazyScript(src){
  return new Promise(res => {
    const s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = () => res(true); s.onerror = () => res(false);
    document.body.appendChild(s);
  });
}

                       "mr","mrs","ms","gen","lt","brig","phd","mba","h","e"]);
  function toks(s){
    s = (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    return s.replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(w => w && !HON.has(w));
  }
  const key = ts => ts.join(" ");
  const skey = ts => ts.slice().sort().join(" ");

  /* ---- CSV (LinkedIn Connections.csv: quoted fields, preamble lines) ---- */
  function parseCSV(text){
    const rows = []; let row = [], cell = "", q = false;
    for(let i = 0; i < text.length; i++){
      const ch = text[i];
      if(q){
        if(ch === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if(ch === '"') q = true;
      else if(ch === ","){ row.push(cell); cell = ""; }
      else if(ch === "\n" || ch === "\r"){
        if(ch === "\r" && text[i+1] === "\n") i++;
        row.push(cell); cell = "";
        if(row.some(c => c !== "")) rows.push(row);
        row = [];
      } else cell += ch;
    }
    if(cell !== "" || row.length){ row.push(cell); if(row.some(c => c !== "")) rows.push(row); }
    return rows;
  }
  function normUrl(u){
    u = (u || "").trim();
    if(!u) return "";
    u = u.replace(/^https?:\/\//i, "").replace(/^www\./i, "").replace(/[?#].*$/, "").replace(/\/+$/, "");
    return u.toLowerCase();
  }
  function slugName(url){
    const m = normUrl(url).match(/linkedin\.com\/in\/([^\/]+)/);
    if(!m) return "";

    return s.replace(/-\w*\d\w*$/, "").split("-").map(w => w ? w[0].toUpperCase() + w.slice(1) : w).join(" ").trim();
  }
  const STRENGTHS = ["strong", "medium", "weak"];
  function normStrength(s){
    s = (s || "").trim().toLowerCase();
    if(STRENGTHS.includes(s)) return s;
    if(["s","close","high","3","强"].includes(s)) return "strong";

  let contacts = null, rels = {}, matches = null;
  const live = c => c && !c.del;
  function boot(){
    contacts = load(K_CONTACTS); rels = load(K_RELS) || {};
    if(contacts && contacts.list && (contacts.v || 1) < 2){          // migrate v1 -> v2
      contacts.list.forEach((c, i) => { if(c.i === undefined) c.i = i; });
      contacts.v = 2; contacts.next = contacts.list.length;
      save(K_CONTACTS, contacts);
    }
    matches = load(K_MATCH);
    if(contacts && contacts.list && !matches){ matches = runMatch(contacts.list); save(K_MATCH, matches); }
  }
  function persist(){ if(!contacts) return; contacts.at = Date.now(); save(K_CONTACTS, contacts); save(K_RELS, rels); }
  function clearOtherCaches(){
    try { Object.keys(localStorage).forEach(k => { if(k.startsWith("pm2_matches_v1_") && k !== K_MATCH) localStorage.removeItem(k); }); } catch(e){}
  }
  function idxOf(cid){ return contacts ? contacts.list.findIndex(c => c.i === cid) : -1; }

  function importCSV(text){
    const rows = parseCSV(text);
    const hi = rows.findIndex(r => r.some(c => {
      const v = (c || "").trim().toLowerCase();
      return COLS.fn.includes(v) || COLS.n.includes(v) || COLS.url.includes(v);
    }));
    if(hi < 0) return null;
    const head = rows[hi].map(h => h.trim().toLowerCase());
    const col = keys => head.findIndex(h => keys.includes(h));
    const CI = {}; Object.keys(COLS).forEach(k => CI[k] = col(COLS[k]));
    const get = (r, k) => CI[k] >= 0 ? (r[CI[k]] || "").trim() : "";
    let added = 0, dup = 0;
    rows.slice(hi + 1).forEach(r => {
      const name = get(r, "n") || (get(r, "fn") + " " + get(r, "ln")).trim() || slugName(get(r, "url"));
      const url = get(r, "url");
      if(!name && !url) return;
      const res = upsert({n:name, co:get(r, "co"), po:get(r, "po"), url, em:get(r, "em"), loc:get(r, "loc")},
                         {s:normStrength(get(r, "s")), note:get(r, "note"),
                          tags:get(r, "tags").split(/[|;,]/).map(x => x.trim()).filter(Boolean)});
      res.added ? added++ : dup++;
    });
    if(added || dup) persist();          // dup rows may still enrich blanks / merge relationship data
    if(added){ clearOtherCaches(); rematch(); }
    return {added, dup};
  }
  function addContact(url, name){
    const nu = normUrl(url);
    if(nu && !/linkedin\.com\/in\//.test(nu)) return {error:"url"};
    const nm = (name || "").trim() || slugName(url);
    if(!nm && !nu) return {error:"empty"};
    const res = upsert({n:nm, co:"", po:"", url:(url || "").trim(), em:"", loc:""}, {});
    if(res.added){ persist(); clearOtherCaches(); rematch(); }
    return res;
  }
  function addManual(o){
    const nm = (o.n || "").trim();
    if(!nm) return {error:"empty"};
    const res = upsert({n:nm, co:(o.co || "").trim(), po:(o.po || "").trim(), url:"", em:"", loc:"", src:"manual"}, {});
    if(res.added){ persist(); clearOtherCaches(); rematch(); }
    const ci = idxOf(res.cid);
    return Object.assign(res, {insts:(matches && matches.instByC[ci]) || []});
  }
  function knownIndex(pid){
    if(!contacts) return -1;
    for(let i = 0; i < contacts.list.length; i++){
      const c = contacts.list[i];
      if(!live(c)) continue;
      const m = matches && matches.byC[i];
      if((c.pid === pid && c.region === REGION) || (m && m.pid === pid && (m.st === "auto" || m.st === "confirmed"))) return i;
    }
    return -1;
  }
  /* "I know this person": the user picked the exact map entry, so the match is confirmed by them */
  function addKnown(pid){
    const p = byId[pid];
    if(!p) return {error:"missing"};
    if(knownIndex(pid) >= 0) return {added:false};
    const r = currentRole(p), inst = r ? byId[r[0]] : null;
    const res = upsert({n:p.name, co:inst ? inst.name : "", po:r ? r[1] : "", url:"", em:"", loc:"", src:"manual"}, {});
    const ci = idxOf(res.cid), c = contacts.list[ci];
    c.pid = pid; c.region = REGION; delete c.del;
    persist();
    if(!matches) matches = {v:1, at:Date.now(), byC:{}, instByC:{}};
    matches.byC[ci] = {pid, sc:1, st:"confirmed"};
    const ins = companyInsts(c.co, buildIndexes());
    if(ins.length) matches.instByC[ci] = ins;
    save(K_MATCH, matches);
    return {added:true, cid:c.i};
  }
  function forget(pid){
    if(!contacts) return 0;
    let k = 0;
    contacts.list.forEach((c, i) => {
      if(!live(c)) return;
      const m = matches && matches.byC[i];
      const mine = c.pid === pid && c.region === REGION;
      const matched = m && m.pid === pid && (m.st === "auto" || m.st === "confirmed");
      if(!mine && !matched) return;
      if(c.src === "manual" || mine){ c.del = true; if(matches) delete matches.byC[i]; }
      else m.st = "rejected";                        // an imported contact: the match was wrong
      k++;
    });
    persist(); if(matches) save(K_MATCH, matches);
    return k;
  }
  function removeContact(cid){
    const ci = idxOf(cid);
    if(ci < 0) return;
    contacts.list[ci].del = true;
    if(matches){ delete matches.byC[ci]; delete matches.instByC[ci]; }
    persist(); if(matches) save(K_MATCH, matches);
  }

  /* ---- indexes over the current map ---- */
  function buildIndexes(){
    const pExact = {}, pTok = {}, iExact = {}, iSubs = [];
    nodes.forEach(n => {
      if(n.layer) return;
      const names = [n.name].concat(AKAS[n.id] || [], n.kind === "inst" && n.short !== n.name ? [n.short] : []);
      names.forEach(v => {
        const ts = toks(v);
        if(!ts.length) return;
        if(n.kind === "person"){
          (pExact[key(ts)] = pExact[key(ts)] || new Set()).add(n);
          (pExact[skey(ts)] = pExact[skey(ts)] || new Set()).add(n);
          ts.forEach(w => { if(w.length >= 3){ (pTok[w] = pTok[w] || new Set()).add(n); } });
        } else {
          iExact[key(ts)] = n.id;
          if(key(ts).length >= 6) iSubs.push([key(ts), n.id]);
        }
      });
    });
    return {pExact, pTok, iExact, iSubs};
  }
  function companyInsts(co, ix){
    const ts = toks(co);
    if(!ts.length) return [];
    const k = key(ts), out = new Set();
    if(ix.iExact[k]) out.add(ix.iExact[k]);
    if(k.length >= 4) ix.iSubs.forEach(([s, id]) => {
      if(k.includes(s) || (s.includes(k) && k.length >= 6)) out.add(id);
    });
    return [...out];
  }
  function roleInsts(p){ return (p.roles || []).filter(r => !r[4]).map(r => r[0]); }

  /* ---- matching: name + company signals; low confidence is never merged silently ---- */
  function runMatch(list){
    const ix = buildIndexes();
    const byC = {}, instByC = {};
    list.forEach((c, i) => {
      if(!live(c)) return;
      const cInsts = companyInsts(c.co, ix);
      if(cInsts.length) instByC[i] = cInsts;
      if(c.pid && c.region === REGION && byId[c.pid]){ byC[i] = {pid:c.pid, sc:1, st:"confirmed"}; return; }
      const ts = toks(c.n);
      if(ts.length < 2) return;
      const cands = new Map();
      (ix.pExact[key(ts)] || ix.pExact[skey(ts)] || new Set()).forEach(p => cands.set(p, 0.9));
      const shared = {};
      ts.forEach(w => (ix.pTok[w] || new Set()).forEach(p => shared[p.id] = (shared[p.id] || 0) + 1));
      Object.keys(shared).forEach(pid => {
        if(shared[pid] >= 2 && !cands.has(byId[pid])){
          const p = byId[pid], pts = toks(p.name);
          const short = ts.length <= pts.length ? ts : pts, lon = short === ts ? pts : ts;
          if(short.every(w => lon.includes(w))) cands.set(p, 0.8);
        }
      });
      let best = null, bs = 0;
      cands.forEach((base, p) => {
        let s = base;
        if(cInsts.some(id => roleInsts(p).includes(id))) s += 0.09;
        if(s > bs){ bs = s; best = p; }
      });
      if(best && bs >= 0.78)
        byC[i] = {pid:best.id, sc:Math.min(0.99, bs), st:bs >= 0.95 ? "auto" : "review"};
    });
    return {v:1, at:Date.now(), byC, instByC};
  }
  /* re-run matching but keep the user's own confirm / reject decisions */
  function rematch(){
    if(!contacts) return;
    const old = matches;
    matches = runMatch(contacts.list);
    if(old && old.byC) Object.keys(old.byC).forEach(ci => {
      const o = old.byC[ci], nw = matches.byC[ci];
      if((o.st === "confirmed" || o.st === "rejected") && nw && nw.pid === o.pid) nw.st = o.st;
    });
    save(K_MATCH, matches);
  }

  /* ---- contact = shared facts; relationship = the user's private view (pm2_rels) ---- */
  function upsert(c, r){
    if(!contacts) contacts = {v:2, at:Date.now(), next:0, list:[]};
    const nu = normUrl(c.url);
    const nk = key(toks(c.n)) + "|" + key(toks(c.co));
    const hit = contacts.list.find(x =>
      (nu && normUrl(x.url) === nu) ||
      (!nu && c.n && key(toks(x.n)) + "|" + key(toks(x.co)) === nk));
    if(hit){
      const revived = !!hit.del;
      delete hit.del;
      ["co", "po", "em", "loc", "url"].forEach(f => { if(!hit[f] && c[f]) hit[f] = c[f]; });
      if(c.src && !hit.src) hit.src = c.src;
      if(r && (r.s || r.note || (r.tags && r.tags.length))) setRel(hit.i, r, true);
      return {added:revived, cid:hit.i};
    }
    c.i = contacts.next++;
    contacts.list.push(c);
    if(r && (r.s || r.note || (r.tags && r.tags.length))) setRel(c.i, r, true);
    return {added:true, cid:c.i};
  }
  function rel(cid){ return rels[cid] || {s:"", tags:[], note:""}; }
  function setRel(cid, patch, defer){
    const cur = rels[cid] || {s:"", tags:[], note:"", added:new Date().toISOString().slice(0, 10)};
    if(patch.s !== undefined) cur.s = normStrength(patch.s);
    if(patch.tags !== undefined) cur.tags = [...new Set(patch.tags.map(x => String(x).trim()).filter(Boolean))];
    if(patch.note !== undefined) cur.note = String(patch.note);
    rels[cid] = cur;
    if(!defer) persist();
    return cur;
  }
  function relForPerson(pid){
    const i = knownIndex(pid);
    return i < 0 ? null : rel(contacts.list[i].i !== undefined ? contacts.list[i].i : i);
  }
  function decide(ci, ok){
    if(!matches || !matches.byC[ci]) return;
    matches.byC[ci].st = ok ? "confirmed" : "rejected";
    save(K_MATCH, matches);
  }
  function reviewQueue(){
    if(!contacts || !matches) return [];
    return Object.keys(matches.byC)
      .filter(ci => matches.byC[ci].st === "review" && live(contacts.list[ci]))
      .map(ci => ({ci, c:contacts.list[ci], m:matches.byC[ci], p:byId[matches.byC[ci].pid]}))
      .filter(x => x.c && x.p);
  }
  function derived(){
    if(!contacts || !matches) return {contacts:[], direct:new Map()};
    const out = [], direct = new Map();
    contacts.list.forEach((c, i) => {
      if(!live(c)) return;
      const m = matches.byC[i];
      const inst = new Set(matches.instByC[i] || []);
      const rl = rel(c.i !== undefined ? c.i : i);
      let pid = null;
      if(m && (m.st === "auto" || m.st === "confirmed") && byId[m.pid]){
        pid = m.pid;
        const conf = c.src === "manual" ? "me" : (m.st === "confirmed" ? "lic" : "auto");
        if(!direct.has(pid)) direct.set(pid, {conf, s:rl.s || ""});
        roleInsts(byId[pid]).forEach(id => inst.add(id));
      }
      if(inst.size || pid)
        out.push({n:c.n, pos:c.po, company:c.co, inst:[...inst], s:rl.s, tags:rl.tags || [], pid});
    });
    return {contacts:out, direct};
  }
  function list(){
    if(!contacts) return [];
    return contacts.list.map((c, i) => {
      const m = matches && matches.byC[i];
      return {c, i, rel:rel(c.i !== undefined ? c.i : i),
              pid:m && (m.st === "auto" || m.st === "confirmed") ? m.pid : null};
    }).filter(x => live(x.c));
  }
  function stats(){
    if(!contacts) return null;
    const lst = list();
    if(!lst.length) return null;
    const matched = lst.filter(x => x.pid).length;
    const reach = new Set();
    derived().contacts.forEach(c => c.inst.forEach(id => reach.add(id)));
    const sb = {strong:0, medium:0, weak:0, unrated:0};
    lst.forEach(x => { sb[x.rel.s || "unrated"]++; });
    return {total:lst.length, matched, review:reviewQueue().length, reach:reach.size, at:contacts.at, sb};
  }
  function wipe(){
    try { Object.keys(localStorage).forEach(k => {
      if(k.startsWith("pm2_") && k !== "pm2_token" && k !== "pm2_email") localStorage.removeItem(k);
    }); } catch(e){}
    boot();
  }
  function hasAny(){ return !!(contacts && contacts.list && contacts.list.some(live)); }
  boot();
  return {REGION, hasAny, importCSV, addContact, addManual, addKnown, forget, removeContact, knownIndex, list, rel, setRel,
          relForPerson, decide, reviewQueue, derived, stats, wipe, boot, rematch, toks};
})();

/* ---------- account + private sync (server/api.js) ---------- */
const Acct = (() => {
  const tk = () => { try { return localStorage.getItem("pm2_token"); } catch(e){ return null; } };
  const email = () => { try { return localStorage.getItem("pm2_email"); } catch(e){ return null; } };
  async function call(p, method, body){
    const h = {"Content-Type":"application/json"};
    if(tk()) h["Authorization"] = "Bearer " + tk();
    const r = await fetch("/api/" + p, {method:method || "GET", headers:h, body:body ? JSON.stringify(body) : undefined});
    const j = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(j.error || ("HTTP " + r.status));
    return j;
  }
  const payload = () => {
    const o = {};
    Object.keys(localStorage).forEach(k => {
      if(k.startsWith("pm2_") && k !== "pm2_token" && k !== "pm2_email") o[k] = localStorage.getItem(k);
    });
    return o;
  };
  const applyPayload = d => {
    Object.keys(localStorage).forEach(k => {
      if(k.startsWith("pm2_") && k !== "pm2_token" && k !== "pm2_email") localStorage.removeItem(k);
    });
    if(d) Object.keys(d).forEach(k => { try { localStorage.setItem(k, d[k]); } catch(e){} });
  };
  async function push(){ if(tk()) try { await call("personal", "PUT", {data:payload()}); } catch(e){} }
  async function signIn(mode, em, pw){
    const j = await call(mode, "POST", {email:em, password:pw});
    localStorage.setItem("pm2_token", j.token);
    localStorage.setItem("pm2_email", j.email);
    const p = await call("personal");
    if(p.data && Object.keys(p.data).length) applyPayload(p.data);   // account copy wins
    else await push();                                               // first device: upload local
  }
  async function signOut(){
    try { await call("logout", "POST", {}); } catch(e){}
    localStorage.removeItem("pm2_token");
    localStorage.removeItem("pm2_email");
    Personal.wipe();                       // protect shared devices
  }
  async function deleteRemote(){ if(tk()) try { await call("personal", "DELETE"); } catch(e){} }
  async function changePw(cur, nw){ return call("password", "POST", {current: cur, password: nw}); }
  async function pullIfChanged(){
    if(!tk()) return false;
    try {
      const p = await call("personal");
      if(p.data && Object.keys(p.data).length && JSON.stringify(p.data) !== JSON.stringify(payload())){ applyPayload(p.data); return true; }
    } catch(e){}
    return false;
  }
  return {on:() => !!tk(), email, signIn, signOut, push, deleteRemote, changePw, pullIfChanged};
})();
try {
  if(Acct.on() && !sessionStorage.getItem("pm2_pulled")){
    sessionStorage.setItem("pm2_pulled", "1");
    Acct.pullIfChanged().then(ch => { if(ch) location.reload(); });
  }
} catch(e){}

/* ================================================================
   YOUR POSITION — the "You" node, your links, and demo mode.
   Rebuilt live (no page reload) whenever contacts change.
   ================================================================ */
const DEMO_PEOPLE = [
  {n:"Alex Rahman",   t:"Investment Director"},
  {n:"Maya Haddad",   t:"Partner"},
  {n:"Daniel Okafor", t:"Senior Advisor"},
];
const DEMO = {on:false};
let ME = null, MYNET = null;
let layerEdges = [], layerNodes = [];

function stripLayer(){
  if(!layerEdges.length && !layerNodes.length) return;
  const kill = new Set(layerEdges);
  for(let i = edges.length - 1; i >= 0; i--) if(kill.has(edges[i])) edges.splice(i, 1);
  const touched = new Set();
  layerEdges.forEach(e => { touched.add(e.s); touched.add(e.t); });
  touched.forEach(n => { n.adj = n.adj.filter(a => !kill.has(a.e)); });
  const killN = new Set(layerNodes);
  for(let i = nodes.length - 1; i >= 0; i--) if(killN.has(nodes[i])) nodes.splice(i, 1);
  layerNodes.forEach(n => { if(byId[n.id] === n) delete byId[n.id]; });
  layerEdges = []; layerNodes = [];
}
function layerEdge(e){ e.layer = true; layerEdges.push(e); return linkEdge(e); }
function layerNode(n){
  Object.assign(n, {layer:true, adj:[], deg:0, news:[], contacts:[], myDirect:false, myConf:null, vx:0, vy:0, fixed:false, tx:null, ty:null});
  nodes.push(n); byId[n.id] = n; layerNodes.push(n);
  return n;
}
/* demo contacts sit at three busy organizations in different industries */
function demoInstitutions(){
  const cands = nodes.filter(n => n.kind === "inst" && !n.layer && n.tier > 0 && n.sector !== "gov")
    .map(n => ({n, k:n.adj.filter(a => a.e.kind === "role" && !a.e.former && a.n.kind === "person").length}))
    .filter(x => x.k >= 3).sort((a, b) => b.k - a.k || b.n.power - a.n.power);
  const out = [], used = new Set();
  for(const c of cands){ const g = groupOf(c.n); if(used.has(g)) continue; used.add(g); out.push(c.n); if(out.length === 3) break; }
  for(const c of cands){ if(out.length >= 3) break; if(!out.includes(c.n)) out.push(c.n); }
  return out;
}
function hopLabelMine(conf){
  const T = t();
  return conf === "demo" ? T.hDemoKnow : conf === "me" ? T.hYouAdded : conf === "lic" ? T.hLinkedInConf : T.hLinkedIn;
}
function meAnchors(){ return ME ? ME.adj.filter(a => a.e.kind === "mine").map(a => a.n) : []; }
function meCluster(){
  if(!ME) return [];
  const a = meAnchors();
  return [ME].concat(a.length ? a.slice(0, 16) : ME.adj.slice(0, 10).map(x => x.n));
}
function rebuildPersonal(animate){
  const prev = ME ? {x:ME.x, y:ME.y} : null;
  const prevN = REACH ? REACH.n : 0, prevAnchors = new Set(meAnchors().map(n => n.id));
  stripLayer();
  ME = null;
  nodes.forEach(n => { n.contacts = []; n.myDirect = false; n.myConf = null; });
  const direct = new Map(), byInst = {};
  let all = [];
  if(DEMO.on){
    demoInstitutions().forEach((inst, i) => {
      const d = DEMO_PEOPLE[i], title = d.t + " (sample)";
      const dn = layerNode({id:"__demo" + i, kind:"person", demo:true, name:d.n, short:d.n, sector:inst.sector, tier:3, power:58,
                            roles:[[inst.id, title, "executive", "demo"]], note:t().demoNote,
                            x:inst.x + Math.cos(i * 2.1 + 0.6) * 95, y:inst.y + Math.sin(i * 2.1 + 0.6) * 95, radius:5.8});
      layerEdge({s:dn, t:inst, kind:"role", label:title, v:"demo", demo:true, former:false});
      direct.set(dn.id, {conf:"demo", s:""});
    });
  } else {
    const d = Personal.derived();
    all = d.contacts;
    d.direct.forEach((info, pid) => direct.set(pid, info));
    if(window.MY_NETWORK && window.MY_NETWORK.contacts) all = window.MY_NETWORK.contacts.concat(all);
    all.forEach(c => (c.inst || []).forEach(id => { (byInst[id] = byInst[id] || []).push(c); }));
  }
  Object.keys(byInst).forEach(id => { if(byId[id]) byId[id].contacts = byInst[id]; });
  MYNET = (all.length || DEMO.on) ? {contacts:all} : null;
  const anchors = [...direct.keys()].map(id => byId[id]).filter(Boolean);
  const entries = Object.keys(byInst).map(id => byId[id]).filter(n => n && n.kind === "inst" && n.contacts.some(c => !c.pid));
  if(anchors.length || entries.length){
    const base = anchors.length ? anchors : entries;
    let cx = 0, cy = 0;
    base.forEach(n => { cx += n.x; cy += n.y; });
    cx /= base.length; cy /= base.length;
    const d = Math.hypot(cx, cy) || 1;
    const nm = DEMO.on ? t().youDemo : t().you;
    ME = layerNode({id:"__me", kind:"me", name:nm, short:nm, sector:"__me", tier:3, power:74, radius:10, roles:[], demo:DEMO.on,
                    x:prev ? prev.x : cx + cx / d * 130, y:prev ? prev.y : cy + cy / d * 130,
                    born:(animate && !RM) ? performance.now() : 0});
    anchors.forEach((n, i) => {
      const info = direct.get(n.id);
      n.myDirect = true; n.myConf = info.conf;
      layerEdge({s:ME, t:n, kind:"mine", me:true, v:info.conf, strength:info.s, ord:i, former:false,
                 demo:info.conf === "demo", label:hopLabelMine(info.conf)});
    });
    entries.forEach((n, i) => {
      const k = n.contacts.filter(c => !c.pid).length;
      layerEdge({s:ME, t:n, kind:"minei", me:true, v:"pos", cnt:k, ord:anchors.length + i, former:false,
                 label:fmt(t().hContactsAt, {n:k, org:n.short})});
    });
  }
  alumApply();                                           // the alumni circle layer rides on the same layer system
  /* selection or a route may still point at nodes that were just rebuilt */
  const alive = new Set(nodes);
  if(S.selected && !alive.has(S.selected)){ S.selected = null; if(PANEL_MODE !== "path") closeDetail(); }
  if(S.path && S.path.nodes.some(n => !alive.has(n))){ clearPath(); if(PANEL_MODE === "path") closeDetail(); }
  if(S.hovered && !alive.has(S.hovered)) S.hovered = null;
  if(S.focus && !alive.has(S.focus)) S.focus = null;
  if(S.pulse && !alive.has(S.pulse)) S.pulse = null;
  if(S.pathArm && !alive.has(S.pathArm.node)) S.pathArm = null;
  [...S.expanded].forEach(n => { if(!alive.has(n)) S.expanded.delete(n); });

let DISTRICTS = [];
function computeLayout(){
  nodes.forEach(n => { n.tx = null; n.ty = null; });
  DISTRICTS = [];
  if(S.view === "sector"){
    /* industries as park districts: one cluster per industry group, biggest names in the middle,
       board-level people orbit their organization so they appear next to it when revealed */
    const core = new Map(), satellites = [];
    nodes.forEach(n => {
      if(n.layer) return;
      const gi = groupOf(n);
      if(n.kind === "inst" || n.power >= 56){ if(!core.has(gi)) core.set(gi, []); core.get(gi).push(n); }
      else satellites.push(n);
    });
    const gs = [...core.entries()].sort((a, b) => a[0] - b[0])
      .map(([gi, arr]) => ({gi, arr:arr.sort((a, b) => b.power - a.power), r:19 * Math.sqrt(arr.length) + 48}));
    const GAP = 80;
    const circ = gs.reduce((s, g) => s + 2 * g.r + GAP, 0);
    const R = Math.max(430, circ / (2 * Math.PI));
    let acc = 0;
    gs.forEach(g => {
      const a = ((acc + g.r + GAP / 2) / circ) * Math.PI * 2 - Math.PI / 2;
      acc += 2 * g.r + GAP;
      const cx = Math.cos(a) * R, cy = Math.sin(a) * R;
      g.arr.forEach((n, i) => {

        n.tx = cx + Math.cos(aa) * rr; n.ty = cy + Math.sin(aa) * rr;

      DISTRICTS.push({gi:g.gi, cx, cy, r:g.r, n:g.arr.length});
    });
    const orbit = {};
    satellites.forEach(n => {
      const home = homeInst(n);
      if(home && home.tx !== null){
        const i = orbit[home.id] = (orbit[home.id] || 0) + 1;
        const aa = i * 2.39996, rr = 20 + 8 * Math.sqrt(i);
        n.tx = home.tx + Math.cos(aa) * rr; n.ty = home.ty + Math.sin(aa) * rr;
      } else {
        const d = DISTRICTS.find(x => x.gi === groupOf(n)) || DISTRICTS[0];
        if(d){ n.tx = d.cx; n.ty = d.cy; }
      }
    });
    layerNodes.forEach(n => {
      if(n.demo){ const h = homeInst(n); if(h && h.tx !== null){ n.tx = h.tx + 70; n.ty = h.ty + 46; } }
    });

    const c = S.viewCenter;
    const depth = new Map([[c, 0]]);
    let frontier = [c];
    for(let d = 1; d <= 2; d++){
      const next = [];
      frontier.forEach(n => n.adj.forEach(a => {
        if(a.e.kind !== "pot" && !depth.has(a.n)){ depth.set(a.n, d); next.push(a.n); }
      }));

    }
    const byDepth = [[], [], [], []];
    nodes.forEach(n => byDepth[Math.min(depth.has(n) ? depth.get(n) : 3, 3)].push(n));
    const RING = [0, 240, 480, 820];
    byDepth.forEach((arr, d) => arr.forEach((n, i) => {
      const a = (i / Math.max(arr.length, 1)) * Math.PI * 2 + d * 0.35;
      n.tx = Math.cos(a) * RING[d]; n.ty = Math.sin(a) * RING[d];

    const root = nodes.filter(n => n.kind === "inst").sort((a, b) => b.power - a.power)[0];

    const children = {};

    let frontier = [root];

      const next = [];

/* ---------- physics ---------- */
function physStep(){
  const a = S.alpha;
  if(!(a < 0.003 && S.view === "network")){       // re-organized views keep gliding to their targets
    const vis = [];
    VIS.forEach(n => { if(n.kind !== "me") vis.push(n); });
    const CELL = 180, grid = new Map();
    vis.forEach(n => {
      const k = Math.floor(n.x / CELL) + ":" + Math.floor(n.y / CELL);
      let arr = grid.get(k); if(!arr){ arr = []; grid.set(k, arr); } arr.push(n);
    });
    vis.forEach(n1 => {
      const gx = Math.floor(n1.x / CELL), gy = Math.floor(n1.y / CELL);
      for(let cx = gx - 1; cx <= gx + 1; cx++) for(let cy = gy - 1; cy <= gy + 1; cy++){
        const arr = grid.get(cx + ":" + cy);
        if(!arr) continue;
        for(const n2 of arr){
          if(n2 === n1) continue;
          let dx = n1.x - n2.x, dy = n1.y - n2.y, d2 = dx * dx + dy * dy;
          if(d2 < 1){ dx = (Math.random() - .5); dy = (Math.random() - .5); d2 = 1; }
          if(d2 > 260000) continue;
          const f = 3600 / d2 * a, d = Math.sqrt(d2);

    for(const e of edges){
      if(e.kind === "pot" || e.me || !edgeVisible(e)) continue;
      const rest = e.kind === "family" ? 150 : (e.kind === "own" ? 170 : 130);
      let dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
      const d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
      const f = (d - rest) * springK * a;
      dx /= d; dy /= d;
      e.s.vx += dx * f; e.s.vy += dy * f;
      e.t.vx -= dx * f; e.t.vy -= dy * f;
    }
    vis.forEach(n => {
      if(n.tx !== null){
        const ta = Math.max(a, 0.10);
        n.vx += (n.tx - n.x) * 0.06 * ta;
        n.vy += (n.ty - n.y) * 0.06 * ta;
      } else {
        const r = Math.sqrt(n.x * n.x + n.y * n.y) || 1;
        const target = n.tier === 0 ? Math.min(r, 150) : (TIER_R[n.tier] || 880);
        const pull = (target - r) * (n.tier === 0 ? 0.05 : 0.028) * a;
        n.vx += (n.x / r) * pull; n.vy += (n.y / r) * pull;
        n.vx -= n.x * 0.0004 * a; n.vy -= n.y * 0.0004 * a;
      }
    });
    vis.forEach(n => {
      if(n.fixed){ n.vx = 0; n.vy = 0; return; }
      n.vx *= 0.82; n.vy *= 0.82;
      n.x += Math.max(-14, Math.min(14, n.vx));
      n.y += Math.max(-14, Math.min(14, n.vy));
    });

  }

}

  if(!k) ME.adj.forEach(a => { sx += a.n.x; sy += a.n.y; k++; });
  if(!k) return;
  const cx = sx / k, cy = sy / k, d = Math.hypot(cx, cy) || 1, off = k === 1 ? 105 : 135;

/* ================================================================

  if(S.view === "network") drawRings();
  else if(S.view === "sector") drawDistricts();

  const lit = computeLit();
  const hoverSet = (!lit && S.hovered && !isMob()) ? neighborsOf(S.hovered) : null;
  const P = S.path, pAge = P ? now - P.t0 : 0;
  const hlOn = S.hl.size > 0;
  const meAge = ME && ME.born ? now - ME.born : 1e9;
  /* the network steps back while you find your place; it also unfolds from the center on a first visit */
  S.dim += (S.dimGoal - S.dim) * (RM ? 1 : 0.08);
  const dimF = S.dim;
  const rv = S.reveal ? now - S.reveal.t0 : -1;
  if(rv > 2800) S.reveal = null;
  const rvEdge = rv >= 0 ? Math.max(0, Math.min(1, (rv - 800) / 1200)) : 1;
  const prox = (MOUSE && !RM && !P && !lit && !dragNode && !isMob()) ? MOUSE : null;

  /* ---- edges ---- */
  for(const e of edges){
    if(!edgeVisible(e)) continue;
    let [x1, y1] = toScreen(e.s.x, e.s.y), [x2, y2] = toScreen(e.t.x, e.t.y);
    if(Math.max(x1, x2) < -40 || Math.min(x1, x2) > W + 40 || Math.max(y1, y2) < -40 || Math.min(y1, y2) > H + 40) continue;
    let col = C.edge, alpha = 0.3, width = 1, dash = null, glow = 0;
    if(e.kind === "own"){ col = C.edgeOwn; alpha = 0.36; width = 1.15; }
    else if(e.kind === "family"){ col = C.edgeFam; alpha = 0.42; width = 1.1; }
    else if(e.kind === "pot"){ dash = DASH.pot; alpha = 0.22; }
    else if(e.kind === "alumni"){ dash = DASH.pot; alpha = 0.18; width = 0.9; }
    if(e.v === "ns"){ dash = DASH.ns; alpha = Math.min(alpha, 0.2); }
    if(e.former){ dash = DASH.former; alpha = Math.min(alpha, 0.14); }
    if(e.me){
      col = C.accentRGB;
      if(e.kind === "mine"){ alpha = 0.85; width = 1.8; dash = e.v === "demo" ? DASH.demo : null; }
      else { alpha = (S.selected === ME) ? 0.5 : 0.16; dash = DASH.pot; }
    } else if(e.demo){ col = C.demoRGB; alpha = 0.7; width = 1.4; dash = DASH.demo; }

    const onPath = P && P.edgeSet.has(e);
    if(onPath){
      const idx = P.edges.indexOf(e), cls = P.hops[idx] ? P.hops[idx].cls : "confirmed";
      if(idx * STEP_MS <= pAge){
        col = cls === "demo" ? C.demoRGB : C.white; alpha = 0.95;
        width = (S.pathStep === idx || S.pathStep === idx + 1) ? 3.2 : 2.4;
        dash = cls === "confirmed" ? null : (DASH[cls] || null); glow = 10;
        const grow = Math.min(1, (pAge - idx * STEP_MS) / STEP_MS);    // the segment draws itself
        if(grow < 1){
          const fromS = P.nodes[idx] === e.s;
          const [ax, ay] = fromS ? [x1, y1] : [x2, y2], [bx, by] = fromS ? [x2, y2] : [x1, y1];
          x1 = ax; y1 = ay; x2 = ax + (bx - ax) * grow; y2 = ay + (by - ay) * grow;
        }
      } else alpha = 0.05;
    } else if(P) alpha *= 0.07;
    else if(lit){
      const ds = lit.get(e.s), dt = lit.get(e.t);
      if(ds !== undefined && dt !== undefined){
        if(Math.min(ds, dt) === 0){ if(!e.me && !e.demo) col = C.white; alpha = Math.max(alpha, 0.75); width = Math.max(width, 1.6); }
        else { if(!e.me && !e.demo) col = C.white; alpha = 0.2; width = 1.1; }
      } else alpha *= 0.1;
    } else if(hoverSet){
      if(e.s === S.hovered || e.t === S.hovered){ col = C.edgeHover; alpha = Math.min(0.85, alpha * 2.4); width += 0.4; }
      else alpha *= 0.45;
    } else if(S.askSet){
      if(!(S.askSet.has(e.s) && S.askSet.has(e.t))) alpha *= 0.12;
    } else if(hlOn){
      const a1 = S.hl.has(groupOf(e.s)), a2 = S.hl.has(groupOf(e.t));
      if(a1 && a2) alpha = Math.min(0.75, alpha * 1.9); else if(a1 || a2) alpha *= 0.5; else alpha *= 0.1;
    }
    if(e === S.selectedEdge){ col = C.white; alpha = 0.95; width = 2.2; glow = 8; }
    if(!onPath && !e.layer) alpha *= S.edgeFade * dimF * rvEdge;
    if(e.me && meAge < 2400){                       // your links grow out from you as you appear
      const p = Math.max(0, Math.min(1, (meAge - 450 - (e.ord || 0) * 150) / 420));
      if(p <= 0) continue;
      x2 = x1 + (x2 - x1) * p; y2 = y1 + (y2 - y1) * p;
    }
    if(alpha < 0.01) continue;
    ctx.beginPath(); edgePath(x1, y1, x2, y2);
    ctx.setLineDash(dash || []);
    ctx.strokeStyle = `rgba(${col},${alpha})`; ctx.lineWidth = width;
    if(glow){ ctx.shadowColor = `rgba(${C.accentRGB},.7)`; ctx.shadowBlur = glow; }
    ctx.stroke();
    if(glow) ctx.shadowBlur = 0;
  }
  ctx.setLineDash([]);

  /* ---- nodes ---- */
  const labels = [], heroBoxes = [];
  for(const n of nodes){
    if(!VIS.has(n)) continue;
    const [x, y] = toScreen(n.x, n.y);
    if(x < -60 || x > W + 60 || y < -60 || y > H + 60) continue;
    let r = nodeR(n);
    let a = 1;
    if(P){
      const i = P.nodes.indexOf(n);
      a = i < 0 ? 0.1 : (i === 0 || (i - 1) * STEP_MS + STEP_MS * 0.7 <= pAge ? 1 : 0.22);
    } else if(lit) a = lit.has(n) ? (lit.get(n) === 2 ? 0.5 : 1) : 0.12;
    else if(hoverSet) a = hoverSet.has(n) ? 1 : 0.4;
    else if(S.askSet) a = S.askSet.has(n) ? 1 : 0.14;
    else if(hlOn) a = (S.hl.has(groupOf(n)) || n.layer) ? 1 : 0.13;
    if(!n.layer && dimF < 0.999) a *= dimF;
    if(rv >= 0 && !n.layer){
      const rd = Math.min(1, Math.hypot(x - W / 2, y - H / 2) / (0.6 * Math.hypot(W, H)));
      const u = Math.max(0, Math.min(1, (rv - rd * 1500) / 600));
      if(u <= 0) continue;
      a *= u; r *= 0.45 + 0.55 * u;
    }
    if(prox){                                         // nodes near the pointer lean in, gently
      const dd = Math.hypot(x - prox[0], y - prox[1]);
      if(dd < 120){ const f = 1 - dd / 120; r *= 1 + 0.22 * f * f; a += (1 - a) * 0.35 * f; }
    }
    const selected = n === S.selected || (S.pathArm && n === S.pathArm.node), hovered = n === S.hovered;
    if(n.kind === "me"){
      if(meAge < 700) r *= Math.max(0, easeBack(meAge / 700));
      if(r <= 0.5) continue;
      a = P ? (P.nodes.includes(n) ? 1 : 0.3) : Math.max(a, 0.92);   // "you are here" stays readable
      ctx.globalAlpha = a;
      drawMe(x, y, r, now, selected);
    } else {
      if(n.myDirect && !P) a = Math.max(a, 0.95);     // your connections never fade into the crowd
      ctx.globalAlpha = a;
      const sc = sectorColor(n.sector), cls = nodeClass(n);
      drawShapePath(n, x, y, r);
      ctx.fillStyle = C.fill; ctx.fill();
      ctx.fillStyle = hexA(sc, n.power >= 80 ? 0.46 : 0.32); ctx.fill();
      if(selected || hovered){ ctx.shadowColor = selected ? "rgba(255,255,255,.6)" : hexA(sc, .7); ctx.shadowBlur = selected ? 14 : 8; }
      ctx.strokeStyle = selected ? "#FFFFFF" : (n.demo ? "#F2B544" : sc);
      ctx.lineWidth = selected ? cls.lw + 1 : cls.lw;
      if(n.demo) ctx.setLineDash([3, 2.5]);
      ctx.stroke();
      ctx.setLineDash([]); ctx.shadowBlur = 0;
      if(n.kind === "person" && n.power >= 90 && r >= 10 && (selected || hovered)){
        ctx.fillStyle = C.ink;
        ctx.font = `600 ${Math.max(8, r * 0.7)}px ${FONT}`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(initials(n), x, y + 0.5);
        ctx.textBaseline = "alphabetic";
        if(a > 0.5) heroBoxes.push({x0:x - r, y0:y - r, x1:x + r, y1:y + r, n});
      }
      if(n.myDirect && a > 0.3){                       // someone you know: solid glowing ring
        const rgb = n.myConf === "demo" ? C.demoRGB : C.accentRGB;
        ctx.beginPath(); ctx.arc(x, y, r + 5, 0, Math.PI * 2);
        ctx.shadowColor = `rgba(${rgb},0.9)`; ctx.shadowBlur = 10;
        ctx.strokeStyle = `rgba(${rgb},1)`; ctx.lineWidth = 2.2; ctx.stroke();
        ctx.shadowBlur = 0;
      } else if(n.contacts.length && a > 0.5){         // an organization where your contacts work
        ctx.beginPath(); ctx.setLineDash([3, 3]);
        ctx.arc(x, y, r + 5, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(${C.accentRGB},0.6)`;
        ctx.lineWidth = 1.4; ctx.stroke(); ctx.setLineDash([]);
      }
      if(n.alum && a > 0.3 && !n.myDirect){           // in your alumni circle layer: dotted gold ring
        ctx.beginPath(); ctx.setLineDash([2, 2.5]);
        ctx.arc(x, y, r + 3.5, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(232,196,106,.95)"; ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);
      }
      if(n.news.length && a > 0.5){
        const bx = x + r * 0.85 + 2, by = y - r * 0.85 - 2;
        ctx.beginPath(); ctx.arc(bx, by, 3.4, 0, Math.PI * 2);
        ctx.fillStyle = C.news; ctx.fill();
        ctx.strokeStyle = C.halo; ctx.lineWidth = 1.2; ctx.stroke();
      }
    }
    if(P && a > 0.5 && P.nodes.includes(n)) heroBoxes.push({x0:x - r - 2, y0:y - r - 2, x1:x + r + 2, y1:y + r + 2, n});   // route stops keep labels off them
    if(P && S.pathStep >= 0 && P.nodes[S.pathStep] === n) ring(x, y, r, now);
    if(S.pulse === n) ring(x, y, r, now, C.white);
    ctx.globalAlpha = 1;
    if(a > 0.2 && labelEligible(n, lit, hoverSet)) labels.push({n, x, y, r, a, prio:labelPrio(n, lit)});
  }
  if(REACH && REACH.t0 && !P){
    const age = now - REACH.t0;
    if(age > 3800) REACH.t0 = 0; else drawRipple(age);
  }
  if(S.intro) return;                              // act I is the constellation alone: no names yet
  /* district tags step back while you are following a route or a selection, or finding your place */
  let quiet = P ? 0.22 : (lit ? 0.5 : 1);
  if(dimF < 0.98) quiet = Math.min(quiet, 0.2 + 0.8 * Math.max(0, (dimF - 0.32) / 0.68));
  const tags = S.view === "sector" ? drawDistrictLabels(quiet) : [];
  drawLabels(S.dimGoal < 1 ? labels.filter(L => L.n.layer) : labels, (quiet < 1 ? [] : tags).concat(heroBoxes));
  if(!ME && S.dim < 0.95){ const vr = viewRect(); drawGhost(vr.cx, vr.cy, now, (1 - S.dim) / 0.6); }
}
/* "you are here" waves out through the people you could now reach, nearest first */
function drawRipple(age){
  REACH.d.forEach((lv, n) => {
    if(n.kind === "me" || !VIS.has(n)) return;
    const lt = age - (650 + lv * 430);
    if(lt <= 0 || lt >= 1300) return;
    const [x, y] = toScreen(n.x, n.y);
    if(x < -30 || x > W + 30 || y < -30 || y > H + 30) return;
    const p = lt / 1300, k = lv <= 2 ? 0.8 : 0.42, r = nodeR(n), pn = REACH.par.get(n);
    if(pn && lv <= 2 && p < 0.6 && VIS.has(pn)){
      const [px, py] = toScreen(pn.x, pn.y);
      ctx.strokeStyle = `rgba(${C.accentRGB},${((0.6 - p) * 0.9).toFixed(3)})`; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
    }
    ctx.strokeStyle = `rgba(${C.accentRGB},${((1 - p) * k).toFixed(3)})`; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(x, y, r + 3 + p * 12, 0, Math.PI * 2); ctx.stroke();
  });
}
/* the empty starting point shown while you choose how to put yourself on the map */
function drawGhost(x, y, now, al){
  const p = RM ? 0.5 : (Math.sin(now / 480) + 1) / 2, R = 46 + p * 10;
  ctx.globalAlpha = Math.max(0, Math.min(1, al));
  const g = ctx.createRadialGradient(x, y, 0, x, y, R);
  g.addColorStop(0, `rgba(${C.accentRGB},.5)`); g.addColorStop(1, `rgba(${C.accentRGB},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.fill();
  ctx.setLineDash([3, 4]); ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(x, y, 13 + p * 2, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = C.accent; ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
  ctx.font = `600 12.5px ${FONT}`; ctx.textAlign = "center"; ctx.lineJoin = "round";
  ctx.lineWidth = 4; ctx.strokeStyle = C.halo; ctx.strokeText(t().ghostLabel, x, y + 36);
  ctx.fillStyle = C.ink; ctx.fillText(t().ghostLabel, x, y + 36);
  ctx.globalAlpha = 1;
}

/* ---------- main loop ---------- */
let booted = false;
function tickFade(now){
  const f = S.fade;
  if(!f) return;
  const u = Math.min(1, (now - f.t0) / Math.max(1, f.ms));
  S.edgeFade = f.from + (f.to - f.from) * u;
  if(u >= 1) S.fade = null;
}
function fadeEdges(to, ms){
  if(RM || !ms){ S.fade = null; S.edgeFade = to; return; }
  S.fade = {from:S.edgeFade, to, t0:performance.now(), ms};
}
function loop(now){
  now = now || performance.now();
  if(W < 10 && window.innerWidth > 10){ resize(); fitView(); }
  tickCam(now); tickFade(now);
  computeVisible();
  if(S.physics) physStep();
  draw(now);
  if(!booted){ booted = true; hideBoot(); }
  requestAnimationFrame(loop);
}
function hideBoot(){
  clearTimeout(window.__bootSlow);
  const b = document.getElementById("boot");
  if(b){ b.classList.add("gone"); setTimeout(() => b.remove(), 450); }
}

/* ---------- picking (screen space: touch targets never shrink below ~44px) ---------- */
function pick(px, py, slop){
  let best = null, bestD = 1e9;
  const mob = isMob();
  for(const n of nodes){
    if(!VIS.has(n)) continue;
    const [sx, sy] = toScreen(n.x, n.y);
    const d = Math.hypot(sx - px, sy - py);
    const hitR = Math.max(nodeR(n) + (slop || 5), mob ? 22 : 9);
    if(d < hitR && d < bestD){ best = n; bestD = d; }
  }
  return best;
}
function pickEdge(px, py){
  let best = null, bestD = 7;
  edges.forEach(e => {
    if(!edgeVisible(e)) return;
    const [x1, y1] = toScreen(e.s.x, e.s.y), [x2, y2] = toScreen(e.t.x, e.t.y);
    const L2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
    if(L2 < 1) return;
    let u = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / L2;
    u = Math.max(0.08, Math.min(0.92, u));
    const d = Math.hypot(px - (x1 + u * (x2 - x1)), py - (y1 + u * (y2 - y1)));
    if(d < bestD){ best = e; bestD = d; }
  });
  return best;
}

/* ---------- mouse ---------- */
const tipEl = document.getElementById("tip");
let dragNode = null, panning = false, lastM = null, downM = null, moved = false, downOnCanvas = false;
canvas.addEventListener("mousedown", ev => {
  if(ev.button !== 0) return;
  downOnCanvas = true; moved = false;
  lastM = downM = [ev.clientX, ev.clientY];
  stopCam();
  const n = pick(ev.clientX, ev.clientY);
  if(n) dragNode = n;
  else { panning = true; canvas.classList.add("dragging"); }
});
window.addEventListener("mousemove", ev => {
  if(dragNode){
    if(!moved && Math.hypot(ev.clientX - downM[0], ev.clientY - downM[1]) < 4) return;
    moved = true; dragNode.fixed = true;
    const [wx, wy] = toWorld(ev.clientX, ev.clientY);
    dragNode.x = wx; dragNode.y = wy;
    reheat(0.25);
    return;
  }
  if(panning && lastM){
    if(Math.hypot(ev.clientX - downM[0], ev.clientY - downM[1]) > 3) moved = true;
    S.cam.x -= (ev.clientX - lastM[0]) / S.cam.k;
    S.cam.y -= (ev.clientY - lastM[1]) / S.cam.k;
    lastM = [ev.clientX, ev.clientY];
    return;
  }
  if(ev.target !== canvas){
    MOUSE = ev.target.closest && ev.target.closest("#intro") && !ev.target.closest(".in-card") ? [ev.clientX, ev.clientY] : null;
    if(S.hovered){ S.hovered = null; tipEl.style.display = "none"; canvas.style.cursor = "grab"; }
    return;
  }
  MOUSE = [ev.clientX, ev.clientY];
  const n = pick(ev.clientX, ev.clientY);
  S.hovered = n;
  canvas.style.cursor = n ? "pointer" : "grab";
  if(n){
    tipEl.innerHTML = tipHtml(n);
    tipEl.style.display = "block";
    tipEl.style.left = Math.min(ev.clientX + 16, window.innerWidth - 300) + "px";
    tipEl.style.top = Math.min(ev.clientY + 14, window.innerHeight - tipEl.offsetHeight - 8) + "px";
  } else tipEl.style.display = "none";
});
window.addEventListener("mouseup", ev => {
  if(!downOnCanvas) return;
  downOnCanvas = false;
  if(dragNode) dragNode.fixed = false;
  if(!moved){
    const n = pick(ev.clientX, ev.clientY);
    if(n) handleNodeClick(n);
    else {
      const e = pickEdge(ev.clientX, ev.clientY);
      if(e) selectEdge(e); else clearFocus();
    }
  }
  dragNode = null; panning = false; lastM = null;
  canvas.classList.remove("dragging");
});
document.addEventListener("mouseleave", () => { MOUSE = null; });
canvas.addEventListener("dblclick", ev => {
  const n = pick(ev.clientX, ev.clientY);
  if(n){ S.focus = (S.focus === n) ? null : n; reheat(0.4); if(S.selected === n) renderProfile(n, true); }
  else { S.focus = null; fitView(600); }
  updateStats();
});
canvas.addEventListener("wheel", ev => {
  ev.preventDefault();
  stopCam();
  const f = ev.deltaY < 0 ? 1.13 : 1 / 1.13;
  const [wx, wy] = toWorld(ev.clientX, ev.clientY);
  S.cam.k = Math.max(0.08, Math.min(3.2, S.cam.k * f));
  const [wx2, wy2] = toWorld(ev.clientX, ev.clientY);
  S.cam.x += wx - wx2; S.cam.y += wy - wy2;
}, {passive:false});
function tipHtml(n){
  if(n.kind === "me") return `<b>${esc(n.name)}</b><div class="d">${esc(subLine(n))}</div>`;
  const col = nodeColor(n);
  let h = `<b>${esc(n.name)}</b><div class="d">${esc(subLine(n))}</div>`
        + `<div class="ti" style="${indVars(col)}">${svgI(indIcon(n))}<span>${esc(sectorName(n.sector))} · ${n.deg} ${t().conns}</span></div>`;
  if(n.demo) h += `<div class="ti" style="color:#F8D58C">${t().sampleData}</div>`;
  if(n.news.length) h += `<div class="ti" style="color:#F2B544">${n.news.length} ${t().tipNews}</div>`;
  if(n.contacts.length) h += `<div class="ti" style="color:#A3AEFF">${n.contacts.length} ${t().tipContacts}</div>`;
  return h;
}

function handleNodeClick(n){
  if(S.pathArm){
    const arm = S.pathArm;
    S.pathArm = null;
    if(arm.node !== n){ arm.role === "from" ? showRouteBetween(arm.node, n) : showRouteBetween(n, arm.node); return; }
  }
  if(Tour.active && Tour.onNodeTap(n)) return;
  S.askSet = null;
  select(n);
}
function clearFocus(){
  S.selected = null; S.selectedEdge = null; S.pathArm = null; S.askSet = null;
  clearPath();
  closeDetail();
}

/* ---------- touch: tap, drag, pinch, double-tap ---------- */
let tState = null, lastTapAt = 0, lastTapXY = [0, 0];
function tDist(a, b){ return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }
canvas.addEventListener("touchstart", ev => {
  ev.preventDefault();
  stopCam();
  if(ev.touches.length === 1){
    const px = ev.touches[0].clientX, py = ev.touches[0].clientY;
    const n = pick(px, py, 12);
    tState = {mode:n ? "node" : "pan", node:n, last:[px, py], start:[px, py], moved:false};
  } else if(ev.touches.length === 2){
    if(tState && tState.node) tState.node.fixed = false;
    const [a, b] = [ev.touches[0], ev.touches[1]];
    tState = {mode:"pinch", d0:tDist(a, b), k0:S.cam.k, mid:[(a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2], moved:true};
  }
}, {passive:false});
canvas.addEventListener("touchmove", ev => {
  ev.preventDefault();
  if(!tState) return;
  if(tState.mode === "pinch" && ev.touches.length >= 2){
    const [a, b] = [ev.touches[0], ev.touches[1]];
    const mid = [(a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2];
    const [wx, wy] = toWorld(mid[0], mid[1]);
    S.cam.k = Math.max(0.08, Math.min(3.2, tState.k0 * tDist(a, b) / tState.d0));
    const [wx2, wy2] = toWorld(mid[0], mid[1]);
    S.cam.x += wx - wx2; S.cam.y += wy - wy2;
    S.cam.x -= (mid[0] - tState.mid[0]) / S.cam.k;
    S.cam.y -= (mid[1] - tState.mid[1]) / S.cam.k;
    tState.mid = mid;
    return;
  }
  if(ev.touches.length !== 1) return;
  const px = ev.touches[0].clientX, py = ev.touches[0].clientY;
  if(Math.hypot(px - tState.start[0], py - tState.start[1]) > 9) tState.moved = true;
  if(tState.mode === "node" && tState.moved){
    tState.node.fixed = true;
    const [wx, wy] = toWorld(px, py);
    tState.node.x = wx; tState.node.y = wy;
    reheat(0.25);
  } else if(tState.mode === "pan"){
    S.cam.x -= (px - tState.last[0]) / S.cam.k;
    S.cam.y -= (py - tState.last[1]) / S.cam.k;
  }
  tState.last = [px, py];
}, {passive:false});
canvas.addEventListener("touchend", ev => {
  ev.preventDefault();
  if(!tState) return;
  if(tState.node) tState.node.fixed = false;
  if(!tState.moved && tState.mode !== "pinch" && ev.touches.length === 0){
    const [px, py] = tState.start;
    const now = Date.now();
    const isDouble = (now - lastTapAt < 320) && Math.hypot(px - lastTapXY[0], py - lastTapXY[1]) < 36;
    lastTapAt = now; lastTapXY = [px, py];
    const n = pick(px, py, 12);
    if(isDouble){
      if(n){ S.focus = (S.focus === n) ? null : n; reheat(0.4); }
      else { S.focus = null; recenter(); }
      updateStats();
    } else if(n) handleNodeClick(n);
    else clearFocus();
  }
  if(ev.touches.length === 0) tState = null;
}, {passive:false});
