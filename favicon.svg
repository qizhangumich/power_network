<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3AB3D2"/>
      <stop offset="0.55" stop-color="#1E7A99"/>
      <stop offset="1" stop-color="#14556E"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#sea)"/>

  <!-- gulf: waves -->
  <path d="M4.5 24.2 Q8 22.6 11.5 24.2 T18.5 24.2 T25.5 24.2" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M7 27.2 Q10 25.9 13 27.2 T19 27.2 T25 27.2" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.2" stroke-linecap="round"/>

  <!-- route to the signal (dashed bearing line) -->
  <path d="M17.6 8.9 L22.6 8.2" stroke="#FFFFFF" stroke-opacity="0.55"
        stroke-width="1.1" stroke-dasharray="1.9 1.7" stroke-linecap="round"/>

  <!-- compass needle drawn as a connected network -->
  <g stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M16 7 L16 14.5 M16 14.5 L10.5 19.5 M16 14.5 L21.5 19.5 M10.5 19.5 L21.5 19.5"/>
  </g>
  <circle cx="16" cy="7" r="2.7" fill="#FFFFFF"/>
  <circle cx="10.5" cy="19.5" r="2.2" fill="#FFFFFF" fill-opacity="0.95"/>
  <circle cx="21.5" cy="19.5" r="2.2" fill="#FFFFFF" fill-opacity="0.95"/>
  <circle cx="16" cy="14.5" r="1.5" fill="#CFEAF2"/>

  <!-- destination star (amber signal) -->
  <circle cx="24.8" cy="7.9" r="2" fill="#F5C15C"/>
</svg>
